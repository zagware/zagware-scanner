# Builds, signs, and pushes ghcr.io/zagware/zagware-scanner on every version tag.
# Uses GITHUB_TOKEN (packages: write) for GHCR -- GH_PAT_PACKAGES was only
# ever needed to create the package under the org namespace the first time;
# the package exists now, so the built-in token suffices. See SUP-11.
#
# Supply chain guarantees:
#   1. Syft, Grype, and Betterleaks cosign signatures verified BEFORE the Docker build
#   2. KICS/Syft/Grype/Betterleaks pinned by hardcoded SHA256 in Dockerfile
#   3. Image signed with cosign (keyless, GitHub OIDC → sigstore Rekor log)
#   4. SPDX SBOM attached as OCI attestation
#   5. SLSA provenance attached as OCI attestation
#   6. GitHub-native provenance (gh attestation verify)
#
# All GitHub Actions are pinned to immutable commit SHAs (not mutable tags)
# to prevent tag-rewrite supply-chain attacks.
#
# Verify the image:
#   cosign verify ghcr.io/zagware/zagware-scanner:latest \
#     --certificate-identity-regexp "^https://github.com/zagware/zagware-scanner/.+$" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Publish zagware-scanner

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest or 2.1.0)'
        required: true
        default: 'latest'

jobs:
  build-sign-push:
    name: Build · Sign · Push
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Releases on tag push
      packages: write        # push to GHCR
      id-token: write        # cosign keyless signing via GitHub OIDC
      attestations: write    # SLSA provenance attestation

    # Gates every publish behind a required reviewer -- tag creation alone is
    # not covered by branch protection, so without this a single compromised
    # account pushing a tag was enough to obtain a cosign-signed, SLSA-
    # attested, :latest-tagged image with no second-party check. The
    # "release" environment is configured in repo Settings with a required
    # reviewer (see .github/CODEOWNERS' @zagware/maintainers team) and,
    # incidentally, also environment-scopes GITHUB_TOKEN. See SUP-09.
    environment: release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Single source of truth for every pinned version/checksum -- the
      # Dockerfile's own ARG defaults. Everything below reads from these
      # instead of duplicating the literals, so there is exactly one place
      # left to update on a version bump and no way for the two files to
      # silently disagree. See SUP-08.
      - name: Read pinned versions from Dockerfile
        run: sed -n 's/^ARG //p' Dockerfile >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # ── Pre-build: verify Syft + Grype + Betterleaks release signatures ──────
      # Anchore/betterleaks sign checksums.txt via cosign/sigstore. verify-blob
      # proves the FILE is authentic (produced by their real CI) -- it says
      # nothing about whether the checksum hand-copied into the Dockerfile
      # actually matches an entry in it. A transcription error, or a value
      # copied from the wrong release, would still print "✓ verified" with no
      # other signal. Each step below extracts the asset's own line from the
      # now-authenticated file and fails closed on any mismatch against the
      # Dockerfile's pinned value. See SUP-07.
      - name: Verify Syft release signature
        run: |
          SYFT_VER="${SYFT_VERSION#v}"
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt" -o syft_checksums.txt
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt.pem" -o syft_checksums.txt.pem
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt.sig" -o syft_checksums.txt.sig
          cosign verify-blob \
            --certificate syft_checksums.txt.pem \
            --signature syft_checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/anchore/syft/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            syft_checksums.txt
          echo "✓ Syft ${SYFT_VERSION} release signature verified"

          EXPECTED=$(grep " syft_${SYFT_VER}_linux_amd64.deb\$" syft_checksums.txt | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::syft_${SYFT_VER}_linux_amd64.deb not found in the verified Syft checksums.txt"
            exit 1
          fi
          if [ "$EXPECTED" != "$SYFT_CHECKSUM" ]; then
            echo "::error::Dockerfile SYFT_CHECKSUM ($SYFT_CHECKSUM) does not match the signed manifest ($EXPECTED)"
            exit 1
          fi
          echo "✓ Dockerfile's pinned SYFT_CHECKSUM matches the signed manifest"
          rm syft_checksums.txt syft_checksums.txt.pem syft_checksums.txt.sig

      - name: Verify Grype release signature
        run: |
          GRYPE_VER="${GRYPE_VERSION#v}"
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt" -o grype_checksums.txt
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt.pem" -o grype_checksums.txt.pem
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt.sig" -o grype_checksums.txt.sig
          cosign verify-blob \
            --certificate grype_checksums.txt.pem \
            --signature grype_checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/anchore/grype/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            grype_checksums.txt
          echo "✓ Grype ${GRYPE_VERSION} release signature verified"

          EXPECTED=$(grep " grype_${GRYPE_VER}_linux_amd64.deb\$" grype_checksums.txt | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::grype_${GRYPE_VER}_linux_amd64.deb not found in the verified Grype checksums.txt"
            exit 1
          fi
          if [ "$EXPECTED" != "$GRYPE_CHECKSUM" ]; then
            echo "::error::Dockerfile GRYPE_CHECKSUM ($GRYPE_CHECKSUM) does not match the signed manifest ($EXPECTED)"
            exit 1
          fi
          echo "✓ Dockerfile's pinned GRYPE_CHECKSUM matches the signed manifest"
          rm grype_checksums.txt grype_checksums.txt.pem grype_checksums.txt.sig

      - name: Verify Betterleaks release signature
        run: |
          curl -sL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/checksums.txt" -o betterleaks_checksums.txt
          curl -sL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/checksums.txt.sigstore.json" -o betterleaks_checksums.txt.sigstore.json
          cosign verify-blob \
            --bundle betterleaks_checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/betterleaks/betterleaks/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            betterleaks_checksums.txt
          echo "✓ Betterleaks v${BETTERLEAKS_VERSION} release signature verified"

          EXPECTED=$(grep " betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz\$" betterleaks_checksums.txt | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz not found in the verified Betterleaks checksums.txt"
            exit 1
          fi
          if [ "$EXPECTED" != "$BETTERLEAKS_CHECKSUM" ]; then
            echo "::error::Dockerfile BETTERLEAKS_CHECKSUM ($BETTERLEAKS_CHECKSUM) does not match the signed manifest ($EXPECTED)"
            exit 1
          fi
          echo "✓ Dockerfile's pinned BETTERLEAKS_CHECKSUM matches the signed manifest"
          rm betterleaks_checksums.txt betterleaks_checksums.txt.sigstore.json

      # ── Build ─────────────────────────────────────────────────────────────────

      # sbom: true and provenance: true require the docker-container buildx driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              stable|secure)
                echo "::error::Refusing to dispatch directly onto ':$INPUT_TAG' -- that tag is only ever moved by promote.yml after its 14-day cooling period and CVE gate. Publish a version tag instead and let promotion advance :$INPUT_TAG the normal way. See SUP-02."
                exit 1
                ;;
            esac
            # Allowlist, not a blocklist: also closes SUP-19 (a newline in
            # INPUT_TAG would otherwise inject arbitrary extra GITHUB_OUTPUT
            # lines) and rejects any other malformed input, not just the two
            # reserved names checked above.
            if ! [[ "$INPUT_TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+|latest)$ ]]; then
              echo "::error::Invalid tag '$INPUT_TAG' -- must be 'latest' or a plain X.Y.Z version. See SUP-19."
              exit 1
            fi
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/zagware/zagware-scanner
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=Zagware Security Scanner
            org.opencontainers.image.description=IaC (KICS) + SCA (Grype) + Secrets (Betterleaks) security scanner for CI pipelines
            org.opencontainers.image.vendor=Zagware Ltd
            org.opencontainers.image.licenses=Apache-2.0 AND MIT
            org.opencontainers.image.source=https://github.com/zagware/zagware-scanner

      - name: Build and push (SBOM + provenance attestations)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build-args here -- the Dockerfile's own ARG defaults are the
          # single source of truth (just verified against the signed
          # upstream manifests above), so nothing here can drift from what
          # the "Verify *" steps checked. See SUP-08.
          sbom: true
          provenance: true

      # ── Sign and attest ───────────────────────────────────────────────────────

      - name: Sign image with cosign
        run: |
          cosign sign --yes "ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }}"
          echo "✓ Signed: ${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/zagware/zagware-scanner
          subject-digest: ${{ steps.build.outputs.digest }}

      # ── Post-push: scan the published image for its own CVEs ─────────────────
      # Advisory only (continue-on-error: true) — this never blocks a publish.
      # The load-bearing CVE gate is promote.yml's 14-day-cooling-period check
      # before :stable/:secure move; this is a same-day heads-up, deliberately
      # not a release gate. See SUP-04.
      - name: Install Grype
        uses: ./.github/actions/install-grype

      - name: Self-scan image with Grype
        continue-on-error: true
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }}"
          echo "Scanning $IMAGE_REF for vulnerabilities..."

          set +e
          SCAN_JSON=$(grype "$IMAGE_REF" -o json 2>/tmp/grype-stderr.log)
          GRYPE_EXIT=$?
          set -e

          if [ "$GRYPE_EXIT" -ne 0 ] || ! echo "$SCAN_JSON" | jq -e '.matches | type == "array"' >/dev/null 2>&1; then
            echo "::warning::Grype self-scan failed or returned unparseable output (exit $GRYPE_EXIT) — vulnerability count for this release is UNKNOWN, not zero."
            cat /tmp/grype-stderr.log
            echo "⚠️ Self-scan did not complete — vulnerability count for this release is **UNKNOWN** (see job log)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          HIGH=$(echo "$SCAN_JSON" | jq '[.matches[] | select(.vulnerability.severity | ascii_downcase | test("high|critical"))] | length')
          echo "HIGH/CRITICAL vulnerabilities in image: $HIGH"
          if [ "$HIGH" != "0" ]; then
            echo "⚠️  $HIGH HIGH/CRITICAL vulnerabilities found in the published image" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No HIGH/CRITICAL vulnerabilities found in the published image" >> $GITHUB_STEP_SUMMARY
          fi

      # ── GitHub Release with auto-generated changelog ──────────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate auto changelog, then append supply chain verification
          gh release create "${{ github.ref_name }}" \
            --repo zagware/zagware-scanner \
            --title "Zagware Scanner ${{ steps.tag.outputs.value }}" \
            --generate-notes \
            --notes ""

          # Append supply chain verification to the generated notes
          gh release edit "${{ github.ref_name }}" \
            --repo zagware/zagware-scanner \
            --notes "$(gh release view '${{ github.ref_name }}' --repo zagware/zagware-scanner --json body --jq '.body')

          ---
          ## Supply chain verification

          \`\`\`bash
          cosign verify ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }} \\
            --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          gh attestation verify oci://ghcr.io/zagware/zagware-scanner:${{ steps.tag.outputs.value }} \\
            --repo zagware/zagware-scanner
          \`\`\`"

      - name: Build summary
        run: |
          echo "## Published \`ghcr.io/zagware/zagware-scanner:${{ steps.tag.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
