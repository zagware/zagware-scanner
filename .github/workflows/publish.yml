# Builds and pushes the Zagware IaC Scanner Docker image on every version tag.
# Push a tag like v1.2.3 to trigger a release.

name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. latest)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading 'v' from the git tag
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            davymcaleer99/zagware-iac-scan:${{ steps.tag.outputs.value }}
            davymcaleer99/zagware-iac-scan:latest
          build-args: |
            KICS_VERSION=2.1.20
