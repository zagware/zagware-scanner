# Builds, signs, and pushes ghcr.io/zagware/zagware-scanner on every version tag.
# GHCR login uses GITHUB_TOKEN. This works ONLY because the zagware-scanner
# repository has been granted Write under the container package's
# Actions-access settings (done 2026-07-31). That grant is the real
# precondition, and it lives in org settings, not in this file -- if it is ever
# revoked, pushes fail with `denied: permission_denied: write_package` even
# though the job below correctly declares `packages: write`, because that
# permission governs the TOKEN, not the PACKAGE.
#
# History, so nobody re-litigates this from first principles: GITHUB_TOKEN was
# tried and reverted in b76e386 ("can't push to the org namespace"), then
# re-applied by SUP-11 in the 2026-07-30 audit on the untested assumption that
# an existing package was sufficient -- run 30624766058 disproved that. The
# repo-level grant is what changed; the assumption was still wrong.
# Fall back to secrets.GH_PAT_PACKAGES (classic PAT, write:packages) if needed.
#
# Supply chain guarantees:
#   1. Syft, Grype, and Betterleaks cosign signatures verified BEFORE the Docker build
#   2. KICS/Syft/Grype/Betterleaks pinned by hardcoded SHA256 in Dockerfile
#   3. Image signed with cosign (keyless, GitHub OIDC → sigstore Rekor log)
#   4. SPDX SBOM attached as OCI attestation
#   5. SLSA provenance attached as OCI attestation
#   6. GitHub-native provenance (gh attestation verify)
#
# All GitHub Actions are pinned to immutable commit SHAs (not mutable tags)
# to prevent tag-rewrite supply-chain attacks. Each pin carries a trailing
# `# vX.Y.Z` comment: the SHA is the security property, the comment is the only
# thing that makes drift visible to a human reading the file. Without it all
# nine pins silently aged onto the deprecated node20 runtime. Both are
# enforced: ci.yml's lint step rejects mutable tag refs, and
# tests/test_workflow_remaining.py requires the version annotation.
#
# Those actions now run on node24, which requires Actions Runner v2.327.1 or
# later. GitHub-hosted runners are fine; a self-hosted runner older than that
# will fail to start them. This applies only to building this repo -- consumers
# invoke the scanner as a container action, which has no Node runtime at all.
#
# Verify the image:
#   cosign verify ghcr.io/zagware/zagware-scanner:latest \
#     --certificate-identity-regexp "^https://github.com/zagware/zagware-scanner/.+$" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Publish zagware-scanner

on:
  push:
    tags:
      - 'v*.*.*'
  # Weekly base refresh. Rebuilds the CURRENT release, unchanged, on whatever
  # the pinned base and apk repositories serve today, and republishes it as
  # :latest plus an immutable :<version>-<date> tag.
  #
  # This exists because the promotion gate and its own remedy used to fight
  # each other. An OS CVE is fixed by rebuilding; a rebuild mints a new digest;
  # under a digest-based cooling clock that reset the soak to zero, so the fix
  # restarted the wait it was meant to end. Blocking findings arrived on 8
  # distinct days in the 83 from 2026-05-22, so a 7-day window closed clean
  # roughly half the time and :stable never happened.
  #
  # promote.yml now runs its clock on the RELEASE, so a rebuild of an
  # already-soaked release is promotable the moment it lands. Sundays, ahead of
  # promote's Monday-onwards daily cron.
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest or 2.1.0)'
        required: true
        default: 'latest'

jobs:
  build-sign-push:
    name: Build · Sign · Push
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Releases on tag push
      packages: write        # push to GHCR
      id-token: write        # cosign keyless signing via GitHub OIDC
      attestations: write    # SLSA provenance attestation

    # Gates every publish behind a required reviewer -- tag creation alone is
    # not covered by branch protection, so without this a single compromised
    # account pushing a tag was enough to obtain a cosign-signed, SLSA-
    # attested, :latest-tagged image with no second-party check. The
    # "release" environment is configured in repo Settings with a required
    # reviewer (see .github/CODEOWNERS' @zagware/maintainers team) and,
    # incidentally, also environment-scopes GITHUB_TOKEN. See SUP-09.
    #
    # The weekly refresh uses a SEPARATE environment with no required reviewer,
    # because a gate that needs a human every Sunday is a gate that stops
    # happening. What that reviewer was protecting against does not apply to
    # this path: the refresh takes no input, publishes no new release, builds
    # from an existing signed release tag rather than a branch, and is refused
    # below unless that tag is both the newest release and an ancestor of main.
    # It cannot touch :stable or :secure -- only promote.yml moves those, and
    # only after its own scan. The residual exposure is that a moved git tag
    # would be rebuilt unreviewed, which the ancestor check is there to catch.
    #
    # "refresh" is configured with a deployment branch policy allowing `main`
    # only. Scheduled runs can only ever fire on the default branch anyway, so
    # the policy costs nothing -- what it buys is that a pushed branch carrying
    # an edited copy of this workflow cannot reach the unreviewed environment.
    # "release" deliberately has NO branch policy: it is entered from tag
    # pushes, and a branch-only policy there would reject every real publish.
    environment: ${{ github.event_name == 'schedule' && 'refresh' || 'release' }}

    steps:
      # Which release does a scheduled refresh rebuild? Resolved before
      # checkout, so this step must not depend on repository contents.
      - name: Resolve refresh target
        id: refresh
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')

          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Newest release tag '${TAG}' is not a plain vX.Y.Z -- refusing to rebuild something this workflow cannot reason about."
            exit 1
          fi

          # Rebuild only the NEWEST release. SUP-02's concern was a publish of
          # an older version silently rolling :latest backwards; pinning the
          # refresh to the newest release makes that structurally impossible
          # rather than merely unlikely.
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Refreshing ${TAG}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled run builds the release tag, not the default branch, so
          # a refresh can never quietly ship whatever has since landed on main.
          ref: ${{ github.event_name == 'schedule' && steps.refresh.outputs.tag || github.ref }}
          # Ancestry is checked below and needs more than the tagged commit.
          fetch-depth: 0

      # Tags are outside branch protection: nothing stops a tag being moved to
      # an arbitrary commit, and the scheduled path has no human reviewer to
      # notice. Requiring the tagged commit to be an ancestor of origin/main
      # means a refresh can only ever rebuild code that went through the
      # reviewed branch, whatever the tag currently points at.
      - name: Verify the refresh target is reachable from main
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          HEAD_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::${{ steps.refresh.outputs.tag }} resolves to ${HEAD_SHA}, which is not an ancestor of origin/main. A release tag pointing off the reviewed branch is exactly what the unattended refresh path must refuse to build."
            exit 1
          fi
          echo "✓ ${HEAD_SHA} is reachable from origin/main"

      # Single source of truth for every pinned version/checksum -- the
      # Dockerfile's own ARG defaults. Everything below reads from these
      # instead of duplicating the literals, so there is exactly one place
      # left to update on a version bump and no way for the two files to
      # silently disagree. See SUP-08.
      - name: Read pinned versions from Dockerfile
        run: sed -n 's/^ARG //p' Dockerfile >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # ── Pre-build: verify Syft + Grype + Betterleaks release signatures ──────
      # Anchore/betterleaks sign checksums.txt via cosign/sigstore. verify-blob
      # proves the FILE is authentic (produced by their real CI) -- it says
      # nothing about whether the checksum hand-copied into the Dockerfile
      # actually matches an entry in it. A transcription error, or a value
      # copied from the wrong release, would still print "✓ verified" with no
      # other signal. Each step below extracts the asset's own line from the
      # now-authenticated file and fails closed on any mismatch against the
      # Dockerfile's pinned value. See SUP-07.
      - name: Verify Syft release signature
        run: |
          SYFT_VER="${SYFT_VERSION#v}"
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt" -o syft_checksums.txt
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt.pem" -o syft_checksums.txt.pem
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt.sig" -o syft_checksums.txt.sig
          cosign verify-blob \
            --certificate syft_checksums.txt.pem \
            --signature syft_checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/anchore/syft/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            syft_checksums.txt
          echo "✓ Syft ${SYFT_VERSION} release signature verified"

          EXPECTED=$(grep " syft_${SYFT_VER}_linux_amd64.deb\$" syft_checksums.txt | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::syft_${SYFT_VER}_linux_amd64.deb not found in the verified Syft checksums.txt"
            exit 1
          fi
          if [ "$EXPECTED" != "$SYFT_CHECKSUM" ]; then
            echo "::error::Dockerfile SYFT_CHECKSUM ($SYFT_CHECKSUM) does not match the signed manifest ($EXPECTED)"
            exit 1
          fi
          echo "✓ Dockerfile's pinned SYFT_CHECKSUM matches the signed manifest"
          rm syft_checksums.txt syft_checksums.txt.pem syft_checksums.txt.sig

      - name: Verify Grype release signature
        run: |
          GRYPE_VER="${GRYPE_VERSION#v}"
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt" -o grype_checksums.txt
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt.pem" -o grype_checksums.txt.pem
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt.sig" -o grype_checksums.txt.sig
          cosign verify-blob \
            --certificate grype_checksums.txt.pem \
            --signature grype_checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/anchore/grype/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            grype_checksums.txt
          echo "✓ Grype ${GRYPE_VERSION} release signature verified"

          EXPECTED=$(grep " grype_${GRYPE_VER}_linux_amd64.deb\$" grype_checksums.txt | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::grype_${GRYPE_VER}_linux_amd64.deb not found in the verified Grype checksums.txt"
            exit 1
          fi
          if [ "$EXPECTED" != "$GRYPE_CHECKSUM" ]; then
            echo "::error::Dockerfile GRYPE_CHECKSUM ($GRYPE_CHECKSUM) does not match the signed manifest ($EXPECTED)"
            exit 1
          fi
          echo "✓ Dockerfile's pinned GRYPE_CHECKSUM matches the signed manifest"
          rm grype_checksums.txt grype_checksums.txt.pem grype_checksums.txt.sig

      - name: Verify Betterleaks release signature
        run: |
          curl -sL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/checksums.txt" -o betterleaks_checksums.txt
          curl -sL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/checksums.txt.sigstore.json" -o betterleaks_checksums.txt.sigstore.json
          cosign verify-blob \
            --bundle betterleaks_checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/betterleaks/betterleaks/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            betterleaks_checksums.txt
          echo "✓ Betterleaks v${BETTERLEAKS_VERSION} release signature verified"

          EXPECTED=$(grep " betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz\$" betterleaks_checksums.txt | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz not found in the verified Betterleaks checksums.txt"
            exit 1
          fi
          if [ "$EXPECTED" != "$BETTERLEAKS_CHECKSUM" ]; then
            echo "::error::Dockerfile BETTERLEAKS_CHECKSUM ($BETTERLEAKS_CHECKSUM) does not match the signed manifest ($EXPECTED)"
            exit 1
          fi
          echo "✓ Dockerfile's pinned BETTERLEAKS_CHECKSUM matches the signed manifest"
          rm betterleaks_checksums.txt betterleaks_checksums.txt.sigstore.json

      # ── osv-scanner: match the Dockerfile pin against upstream's manifest ────
      # osv-scanner publishes SLSA provenance (multiple.intoto.jsonl) rather than
      # a cosign-signed checksums file, so there is no verify-blob equivalent to
      # the three above. What we CAN close here is the transcription risk: the
      # SHA256 hand-copied into the Dockerfile must match upstream's published
      # SHA256SUMS entry. The bytes are then re-verified at build time
      # (sha256sum -c), and the final image is cosign-signed + SLSA-attested
      # below, which covers the osv-scanner binary inside it. See the OSV_SCANNER
      # ARG comment in the Dockerfile.
      - name: Verify osv-scanner checksum against upstream manifest
        run: |
          curl -sL "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_SHA256SUMS" -o osv_sums.txt
          EXPECTED=$(grep " osv-scanner_linux_amd64\$" osv_sums.txt | cut -d' ' -f1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::osv-scanner_linux_amd64 not found in upstream SHA256SUMS for ${OSV_SCANNER_VERSION}"
            exit 1
          fi
          if [ "$EXPECTED" != "$OSV_SCANNER_CHECKSUM" ]; then
            echo "::error::Dockerfile OSV_SCANNER_CHECKSUM ($OSV_SCANNER_CHECKSUM) does not match upstream ($EXPECTED)"
            exit 1
          fi
          echo "✓ osv-scanner ${OSV_SCANNER_VERSION} checksum matches upstream manifest"
          rm osv_sums.txt

      # KICS query rules are fetched by commit SHA in the Dockerfile. That is
      # genuine content-addressing -- immune to tag rewrites and force pushes
      # -- but it says nothing about *which* KICS release those Rego policies
      # belong to, and the pin was only ever checked by hand, once. This
      # re-establishes that link on every build: the pinned commit must still
      # be the object refs/tags/v${KICS_VERSION} resolves to in Checkmarx/kics.
      # Upstream release commits are bot-authored and unsigned, so this is a
      # provenance check, not signature verification -- do not describe it as
      # one. See SUP-15.
      - name: Verify pinned KICS rules commit matches the KICS release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$KICS_RULES_COMMIT" ] || [ -z "$KICS_VERSION" ]; then
            echo "::error::KICS_RULES_COMMIT / KICS_VERSION were not exported from the Dockerfile ARGs -- the rules pin cannot be verified. See SUP-15."
            exit 1
          fi

          REF_JSON=$(curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Checkmarx/kics/git/ref/tags/v${KICS_VERSION}") || REF_JSON=""

          if [ -z "$REF_JSON" ]; then
            echo "::error::Could not resolve refs/tags/v${KICS_VERSION} in Checkmarx/kics -- failing closed rather than building against an unverified rules pin. See SUP-15."
            exit 1
          fi

          REF_TYPE=$(printf '%s' "$REF_JSON" | jq -r '.object.type // ""')
          REF_SHA=$(printf '%s' "$REF_JSON" | jq -r '.object.sha // ""')

          # An annotated tag points at a tag object, not the commit -- deref it.
          if [ "$REF_TYPE" = "tag" ]; then
            REF_SHA=$(curl -sS --fail \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/Checkmarx/kics/git/tags/${REF_SHA}" \
              | jq -r '.object.sha // ""') || REF_SHA=""
          fi

          if [ -z "$REF_SHA" ]; then
            echo "::error::Could not read the commit SHA behind Checkmarx/kics tag v${KICS_VERSION}. See SUP-15."
            exit 1
          fi

          if [ "$REF_SHA" != "$KICS_RULES_COMMIT" ]; then
            echo "::error::Dockerfile KICS_RULES_COMMIT ($KICS_RULES_COMMIT) is NOT the commit Checkmarx/kics v${KICS_VERSION} points to ($REF_SHA). Either the rules pin and the pinned KICS binary version disagree, or the upstream tag moved. See SUP-15."
            exit 1
          fi

          echo "✓ KICS_RULES_COMMIT ${KICS_RULES_COMMIT} is the commit behind Checkmarx/kics v${KICS_VERSION}"
          echo "  (commit pin + release-tag provenance only -- upstream release commits are unsigned, so this is not signature verification)"

      # ── Build ─────────────────────────────────────────────────────────────────

      # sbom: true and provenance: true require the docker-container buildx driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          # Both reach bash as env vars rather than being interpolated into the
          # script text, so the run block stays free of ${{ }} and can be
          # extracted and executed verbatim by
          # tests/test_publish_tag_validation.py. That test is the reason
          # SUP-19's injection bug cannot come back.
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_VERSION: ${{ steps.refresh.outputs.version }}
        run: |
          emit() {
            # Heredoc delimiter form, not `value=...`: even though the
            # allowlist below already makes a newline impossible, the
            # single-line form is what turned a bad input into injected
            # step outputs in the first place. See SUP-19.
            {
              echo "$1<<ZAGWARE_TAG_EOF"
              echo "$2"
              echo "ZAGWARE_TAG_EOF"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              stable|secure)
                echo "::error::Refusing to dispatch directly onto ':$INPUT_TAG' -- that tag is only ever moved by promote.yml after its cooling period and CVE gate. Publish a version tag instead and let promotion advance :$INPUT_TAG the normal way. See SUP-02."
                exit 1
                ;;
            esac
            # Allowlist, not a blocklist: also closes SUP-19 (a newline in
            # INPUT_TAG would otherwise inject arbitrary extra GITHUB_OUTPUT
            # lines) and rejects any other malformed input, not just the two
            # reserved names checked above.
            if ! [[ "$INPUT_TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+|latest)$ ]]; then
              echo "::error::Invalid tag '$INPUT_TAG' -- must be 'latest' or a plain X.Y.Z version. See SUP-19."
              exit 1
            fi
            emit value "${INPUT_TAG}"
            emit image_tag "${INPUT_TAG}"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # A refresh must NOT move :<version>. The README calls that tag
            # immutable per release and people pin it; republishing over it
            # would make the same tag mean two different digests. The rebuild
            # gets its own immutable :<version>-<date> tag, and :latest.
            #
            # `value` stays the clean semver because it is what the version
            # LABEL is set from, and promote.yml reads that label off the
            # digest to decide which release's clock applies.
            if ! [[ "$REFRESH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Refresh version '$REFRESH_VERSION' is not a plain X.Y.Z -- refusing to tag from it."
              exit 1
            fi
            emit value "${REFRESH_VERSION}"
            emit image_tag "${REFRESH_VERSION}-$(date -u +%Y%m%d)"
          else
            emit value "${GITHUB_REF_NAME#v}"
            emit image_tag "${GITHUB_REF_NAME#v}"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/zagware/zagware-scanner
          tags: |
            type=raw,value=${{ steps.tag.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || github.event_name == 'schedule' }}
          # org.opencontainers.image.version is set explicitly rather than left
          # to metadata-action's ref inference, because promote.yml reads it
          # back off the digest to decide which release's cooling clock
          # applies. On a refresh the image TAG carries a date suffix but this
          # label stays the clean semver, so a rebuild is still recognisably a
          # build OF that release.
          labels: |
            org.opencontainers.image.title=Zagware Security Scanner
            org.opencontainers.image.description=IaC (KICS) + SCA (Grype) + Secrets (Betterleaks) security scanner for CI pipelines
            org.opencontainers.image.vendor=Zagware Ltd
            org.opencontainers.image.licenses=Apache-2.0 AND MIT
            org.opencontainers.image.source=https://github.com/zagware/zagware-scanner
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}

      - name: Build and push (SBOM + provenance attestations)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build-args here -- the Dockerfile's own ARG defaults are the
          # single source of truth (just verified against the signed
          # upstream manifests above), so nothing here can drift from what
          # the "Verify *" steps checked. See SUP-08.
          sbom: true
          provenance: true

      # ── Sign and attest ───────────────────────────────────────────────────────

      - name: Sign image with cosign
        run: |
          cosign sign --yes "ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }}"
          echo "✓ Signed: ${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/zagware/zagware-scanner
          subject-digest: ${{ steps.build.outputs.digest }}

      # ── Reachability variant (opt-in) — same core + Go/Node/govulncheck ──────
      # Built, pushed, signed, and attested exactly like the core above, to
      # :<version>-reachability (and :reachability on a tag push or a weekly
      # refresh). Consumers who want call-graph reachability opt into this
      # larger, equally-attested tag.
      - name: Reachability image tags
        id: rtags
        run: |
          {
            echo "value<<ZAGWARE_RTAGS_EOF"
            echo "ghcr.io/zagware/zagware-scanner:${{ steps.tag.outputs.image_tag }}-reachability"
            case "${{ github.event_name }}" in
              push|schedule)
                echo "ghcr.io/zagware/zagware-scanner:reachability"
                ;;
            esac
            echo "ZAGWARE_RTAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push reachability variant (SBOM + provenance)
        id: build_reach
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: reachability
          push: true
          tags: ${{ steps.rtags.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true

      - name: Sign reachability image with cosign
        run: |
          cosign sign --yes "ghcr.io/zagware/zagware-scanner@${{ steps.build_reach.outputs.digest }}"
          echo "✓ Signed reachability: ${{ steps.build_reach.outputs.digest }}"

      - name: Attest reachability build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/zagware/zagware-scanner
          subject-digest: ${{ steps.build_reach.outputs.digest }}

      # ── Post-push: scan the published image for its own CVEs ─────────────────
      # Advisory only (continue-on-error: true) — this never blocks a publish.
      # The load-bearing CVE gate is promote.yml's 14-day-cooling-period check
      # before :stable/:secure move; this is a same-day heads-up, deliberately
      # not a release gate. See SUP-04.
      - name: Install Grype
        uses: ./.github/actions/install-grype

      - name: Self-scan image with Grype
        continue-on-error: true
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }}"
          echo "Scanning $IMAGE_REF for vulnerabilities..."

          set +e
          SCAN_JSON=$(grype "$IMAGE_REF" -o json 2>/tmp/grype-stderr.log)
          GRYPE_EXIT=$?
          set -e

          if [ "$GRYPE_EXIT" -ne 0 ] || ! echo "$SCAN_JSON" | jq -e '.matches | type == "array"' >/dev/null 2>&1; then
            echo "::warning::Grype self-scan failed or returned unparseable output (exit $GRYPE_EXIT) — vulnerability count for this release is UNKNOWN, not zero."
            cat /tmp/grype-stderr.log
            echo "⚠️ Self-scan did not complete — vulnerability count for this release is **UNKNOWN** (see job log)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          HIGH=$(echo "$SCAN_JSON" | jq '[.matches[] | select(.vulnerability.severity | ascii_downcase | test("high|critical"))] | length')
          echo "HIGH/CRITICAL vulnerabilities in image: $HIGH"
          if [ "$HIGH" != "0" ]; then
            echo "⚠️  $HIGH HIGH/CRITICAL vulnerabilities found in the published image" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No HIGH/CRITICAL vulnerabilities found in the published image" >> $GITHUB_STEP_SUMMARY
          fi

      # ── GitHub Release with auto-generated changelog ──────────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate auto changelog, then append supply chain verification
          gh release create "${{ github.ref_name }}" \
            --repo zagware/zagware-scanner \
            --title "Zagware Scanner ${{ steps.tag.outputs.value }}" \
            --generate-notes \
            --notes ""

          # Append supply chain verification to the generated notes
          gh release edit "${{ github.ref_name }}" \
            --repo zagware/zagware-scanner \
            --notes "$(gh release view '${{ github.ref_name }}' --repo zagware/zagware-scanner --json body --jq '.body')

          ---
          ## Supply chain verification

          \`\`\`bash
          cosign verify ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }} \\
            --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          gh attestation verify oci://ghcr.io/zagware/zagware-scanner:${{ steps.tag.outputs.value }} \\
            --repo zagware/zagware-scanner
          \`\`\`"

      - name: Build summary
        run: |
          echo "## Published \`ghcr.io/zagware/zagware-scanner:${{ steps.tag.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
