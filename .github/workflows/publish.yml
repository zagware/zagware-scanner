# Builds, signs, and pushes ghcr.io/zagware/zagware-scanner on every version tag.
# Uses GH_PAT_PACKAGES (scoped classic PAT with write:packages) for GHCR —
# GITHUB_TOKEN cannot push to the org namespace on first creation.
#
# Supply chain guarantees:
#   1. Syft and Grype cosign signatures verified BEFORE the Docker build
#   2. KICS/Syft/Grype pinned by hardcoded SHA256 in Dockerfile
#   3. Image signed with cosign (keyless, GitHub OIDC → sigstore Rekor log)
#   4. SPDX SBOM attached as OCI attestation
#   5. SLSA provenance attached as OCI attestation
#   6. GitHub-native provenance (gh attestation verify)
#
# All GitHub Actions are pinned to immutable commit SHAs (not mutable tags)
# to prevent tag-rewrite supply-chain attacks.
#
# Verify the image:
#   cosign verify ghcr.io/zagware/zagware-scanner:latest \
#     --certificate-identity-regexp "^https://github.com/zagware/zagware-scanner/.+$" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Publish zagware-scanner

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest or 2.1.0)'
        required: true
        default: 'latest'

jobs:
  build-sign-push:
    name: Build · Sign · Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # cosign keyless signing via GitHub OIDC
      attestations: write    # SLSA provenance attestation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # ── Pre-build: verify Syft + Grype release signatures ────────────────────
      # Anchore signs checksums.txt via cosign/sigstore. This verifies the file
      # was produced by a GitHub Actions run in the anchore org — not by an
      # attacker who swapped release artifacts post-TeamPCP style.
      - name: Verify Syft release signature
        env:
          SYFT_VERSION: v1.19.0
          SYFT_VER: 1.19.0
        run: |
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt" -o syft_checksums.txt
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt.pem" -o syft_checksums.txt.pem
          curl -sL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VER}_checksums.txt.sig" -o syft_checksums.txt.sig
          cosign verify-blob \
            --certificate syft_checksums.txt.pem \
            --signature syft_checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/anchore/syft/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            syft_checksums.txt
          echo "✓ Syft ${SYFT_VERSION} release signature verified"
          rm syft_checksums.txt syft_checksums.txt.pem syft_checksums.txt.sig

      - name: Verify Grype release signature
        env:
          GRYPE_VERSION: v0.112.0
          GRYPE_VER: 0.112.0
        run: |
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt" -o grype_checksums.txt
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt.pem" -o grype_checksums.txt.pem
          curl -sL "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_VER}_checksums.txt.sig" -o grype_checksums.txt.sig
          cosign verify-blob \
            --certificate grype_checksums.txt.pem \
            --signature grype_checksums.txt.sig \
            --certificate-identity-regexp "^https://github.com/anchore/grype/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            grype_checksums.txt
          echo "✓ Grype ${GRYPE_VERSION} release signature verified"
          rm grype_checksums.txt grype_checksums.txt.pem grype_checksums.txt.sig

      # ── Build ─────────────────────────────────────────────────────────────────

      # sbom: true and provenance: true require the docker-container buildx driver
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT_PACKAGES }}

      - name: Set image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/zagware/zagware-scanner
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Zagware Security Scanner
            org.opencontainers.image.description=IaC (KICS) + SCA (Grype) security scanner for CI pipelines
            org.opencontainers.image.vendor=Zagware Ltd
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/zagware/zagware-scanner

      - name: Build and push (SBOM + provenance attestations)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KICS_VERSION=2.1.20
            KICS_CHECKSUM=8a5aa375ccfdc0ddd1114eddf1f9638ad7f6122e98d12a592207509dbe6d81f8
            SYFT_VERSION=v1.19.0
            SYFT_CHECKSUM=f3667d6abfa97a1e5614882f81e0a0b090f0047e0df7025b568fa87b6d95ac58
            GRYPE_VERSION=v0.112.0
            GRYPE_CHECKSUM=434bae8af635b6308d7a33ea842c6216dc382d4ec49fe3873f927b7805cc69e2
          sbom: true
          provenance: true

      # ── Sign and attest ───────────────────────────────────────────────────────

      - name: Sign image with cosign
        run: |
          cosign sign --yes "ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }}"
          echo "✓ Signed: ${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/zagware/zagware-scanner
          subject-digest: ${{ steps.build.outputs.digest }}

      # ── Post-push: scan the published image for its own CVEs ─────────────────
      - name: Self-scan image with Grype
        continue-on-error: true
        run: |
          echo "Scanning published image for vulnerabilities..."
          grype "ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }}" \
            -o json --fail-on high > /tmp/grype-self-scan.json 2>&1 || true
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity | ascii_downcase | test("high|critical"))] | length' /tmp/grype-self-scan.json 2>/dev/null || echo "0")
          echo "HIGH/CRITICAL vulnerabilities in image: $HIGH"
          if [ "$HIGH" != "0" ]; then
            echo "⚠️  $HIGH HIGH/CRITICAL vulnerabilities found in the published image" >> $GITHUB_STEP_SUMMARY
            echo "See full scan: /tmp/grype-self-scan.json" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No HIGH/CRITICAL vulnerabilities found in the published image" >> $GITHUB_STEP_SUMMARY
          fi

      # ── GitHub Release with auto-generated changelog ──────────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate auto changelog, then append supply chain verification
          gh release create "${{ github.ref_name }}" \
            --repo zagware/zagware-scanner \
            --title "Zagware Scanner ${{ steps.tag.outputs.value }}" \
            --generate-notes \
            --notes ""

          # Append supply chain verification to the generated notes
          gh release edit "${{ github.ref_name }}" \
            --repo zagware/zagware-scanner \
            --notes "$(gh release view '${{ github.ref_name }}' --repo zagware/zagware-scanner --json body --jq '.body')

          ---
          ## Supply chain verification

          \`\`\`bash
          cosign verify ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }} \\
            --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          gh attestation verify oci://ghcr.io/zagware/zagware-scanner:${{ steps.tag.outputs.value }} \\
            --repo zagware/zagware-scanner
          \`\`\`"

      - name: Build summary
        run: |
          echo "## Published \`ghcr.io/zagware/zagware-scanner:${{ steps.tag.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ghcr.io/zagware/zagware-scanner@${{ steps.build.outputs.digest }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
