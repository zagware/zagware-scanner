# Builds and pushes davymcaleer99/zagware-scanner to DockerHub on every version tag.
# Requires secrets: DOCKERHUB_USERNAME (davymcaleer99), DOCKERHUB_TOKEN
# To release: git tag v2.0.1 && git push origin v2.0.1

name: Publish zagware-scanner

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest or 2.0.1)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    name: Build & push davymcaleer99/zagware-scanner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            davymcaleer99/zagware-scanner:${{ steps.tag.outputs.value }}
            davymcaleer99/zagware-scanner:latest
          build-args: |
            KICS_VERSION=2.1.20
            SYFT_VERSION=v1.19.0
            GRYPE_VERSION=v0.112.0
