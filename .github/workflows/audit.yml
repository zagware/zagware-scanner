# Weekly audit of the :stable image for newly-disclosed CVEs.
# If new HIGH/CRITICAL vulnerabilities are found, opens a GitHub issue
# to alert maintainers. This workflow ALERTS ONLY -- it never re-tags
# anything, and its permissions (issues: write, contents: read) are
# deliberately insufficient to move a tag. Rolling :stable back is a
# manual operation; promote.yml records the digest it replaced in its
# step summary and promotion attestation so the prior digest is on
# record when it is needed. See SUP-17.

name: Audit Stable Image

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Scan :stable for new CVEs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Grype
        uses: ./.github/actions/install-grype

      - name: Resolve :stable digest
        id: stable
        run: |
          # `|| true` is load-bearing. GitHub runs this with `bash -e`, so the
          # failing imagetools lookup aborted the step outright and the "nothing
          # to audit" branch below was unreachable -- the weekly audit reported
          # a red failure every run purely because :stable does not exist yet,
          # which is the ordinary pre-first-promotion state. A missing tag is a
          # skip, not an error; a genuine scan failure is still caught further
          # down, where it is a real finding rather than a bootstrap condition.
          DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/zagware/zagware-scanner:stable \
            --format '{{.Manifest.Digest}}' 2>/dev/null || true)

          if [ -z "$DIGEST" ]; then
            echo "No :stable tag found — nothing to audit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Stable digest: $DIGEST"

      - name: Scan with Grype
        if: steps.stable.outputs.skip != 'true'
        id: scan
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.stable.outputs.digest }}"

          set +e
          SCAN_JSON=$(grype "$IMAGE_REF" -o json 2>/tmp/grype-stderr.log)
          GRYPE_EXIT=$?
          set -e

          if [ "$GRYPE_EXIT" -ne 0 ] || ! echo "$SCAN_JSON" | jq -e '.matches | type == "array"' >/dev/null 2>&1; then
            echo "::error::Grype scan of $IMAGE_REF failed or returned unparseable output (exit $GRYPE_EXIT)."
            echo "::error::This is a SCAN FAILURE, not zero vulnerabilities — the audit cannot make a determination this run."
            cat /tmp/grype-stderr.log
            exit 1
          fi

          # Split fixable from unfixable. The gate fires on FIXABLE only.
          # Two containerd advisories inside KICS have no upstream patch, so a
          # raw-count gate would file an identical issue every week forever for
          # something nobody can action -- and an alert that is always red is an
          # alert nobody reads. The total is still reported so unfixable
          # findings stay visible rather than being silently dropped.
          HIGH_COUNT=$(echo "$SCAN_JSON" | jq '[.matches[]
            | select(.vulnerability.severity | ascii_downcase | test("high|critical"))] | length')
          FIXABLE_COUNT=$(echo "$SCAN_JSON" | jq '[.matches[]
            | select(.vulnerability.severity | ascii_downcase | test("high|critical"))
            | select((.vulnerability.fix.state // "") == "fixed")] | length')

          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          echo "fixable_count=$FIXABLE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $HIGH_COUNT HIGH/CRITICAL in :stable ($FIXABLE_COUNT with an upstream fix)"

      - name: Open issue for new CVEs
        if: steps.stable.outputs.skip != 'true' && steps.scan.outputs.fixable_count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const count = '${{ steps.scan.outputs.fixable_count }}';
            const total = '${{ steps.scan.outputs.high_count }}';
            const digest = '${{ steps.stable.outputs.digest }}';

            // Check if an issue already exists for this digest
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,audit-cve'
            });

            const existing = issues.data.find(i => i.body && i.body.includes(digest));
            if (existing) {
              console.log(`Issue already exists: ${existing.html_url}`);
              return;
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Audit alert: ${count} fixable HIGH/CRITICAL CVEs in :stable (${digest.substring(0, 19)})`,
              body: `The weekly audit found **${count}** HIGH/CRITICAL vulnerabilities **with an upstream fix available** in the current :stable image (${total} HIGH/CRITICAL in total; the remainder have no upstream patch yet and do not trigger this alert).\n\n**Digest:** \`${digest}\`\n\n**Action required:**\n- Review the vulnerabilities and determine if they affect the scanner's runtime safety\n- If critical, consider rolling :stable back to the prior known-good digest\n- Patch the base image or affected packages and release a new version\n\nTo see the full scan results, run:\n\`\`\`bash\ngrype ghcr.io/zagware/zagware-scanner@${digest}\n\`\`\`\n\nTo see only what is actionable:\n\`\`\`bash\ngrype ghcr.io/zagware/zagware-scanner@${digest} --only-fixed\n\`\`\``,
              labels: ['security', 'audit-cve']
            });

      - name: Audit summary
        if: steps.stable.outputs.skip != 'true'
        run: |
          echo "## Weekly Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Stable digest:** \`${{ steps.stable.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**HIGH/CRITICAL CVEs:** ${{ steps.scan.outputs.high_count }} (${{ steps.scan.outputs.fixable_count }} with an upstream fix)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.scan.outputs.fixable_count }}" = "0" ]; then
            if [ "${{ steps.scan.outputs.high_count }}" = "0" ]; then
              echo "✅ No HIGH/CRITICAL vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ Nothing actionable — all ${{ steps.scan.outputs.high_count }} HIGH/CRITICAL findings are awaiting an upstream fix" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ ${{ steps.scan.outputs.fixable_count }} fixable HIGH/CRITICAL vulnerabilities found — issue opened" >> $GITHUB_STEP_SUMMARY
          fi
