# Weekly audit of the :stable image for newly-disclosed CVEs.
# If new HIGH/CRITICAL vulnerabilities are found, opens a GitHub issue
# to alert maintainers. This workflow ALERTS ONLY -- it never re-tags
# anything, and its permissions (issues: write, contents: read) are
# deliberately insufficient to move a tag. Rolling :stable back is a
# manual operation; promote.yml records the digest it replaced in its
# step summary and promotion attestation so the prior digest is on
# record when it is needed. See SUP-17.

name: Audit Stable Image

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Scan :stable for new CVEs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Grype
        uses: ./.github/actions/install-grype

      # Same remedy probe promote.yml runs, and for the same reason: a
      # vendored-module CVE in a vendor binary is only actionable if a newer
      # release of that tool exists to bump to. Alerting weekly on one that has
      # no released fix would be an alarm nobody can close -- GO-2026-5970 in
      # betterleaks had no such release for 35 days.
      - name: Read pinned versions from Dockerfile
        run: sed -n 's/^ARG //p' Dockerfile >> "$GITHUB_ENV"

      - name: Check whether a newer release exists for each bundled tool
        id: newer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TOOLS="syft|anchore/syft|${SYFT_VERSION}
          grype|anchore/grype|${GRYPE_VERSION}
          betterleaks|betterleaks/betterleaks|v${BETTERLEAKS_VERSION}
          osv-scanner|google/osv-scanner|${OSV_SCANNER_VERSION}"

          echo '{}' > /tmp/newer.json
          while IFS='|' read -r binary repo pinned; do
            [ -n "$binary" ] || continue
            binary=$(printf '%s' "$binary" | tr -d '[:space:]')
            pinned=$(printf '%s' "$pinned" | tr -d '[:space:]')

            LATEST=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
            if [ -z "$LATEST" ]; then
              echo "::error::Could not resolve the latest release of ${repo}; the audit cannot say whether its findings are actionable, so it fails rather than guessing."
              exit 1
            fi

            if [ "$pinned" = "$LATEST" ]; then HAS_NEWER=false; else HAS_NEWER=true; fi
            echo "  ${binary}: pinned=${pinned} latest=${LATEST} newer=${HAS_NEWER}"

            jq -c --arg b "$binary" --argjson n "$HAS_NEWER" '. + {($b): $n}' \
              /tmp/newer.json > /tmp/newer.next && mv /tmp/newer.next /tmp/newer.json
          done <<< "$TOOLS"

          echo "value=$(cat /tmp/newer.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve :stable digest
        id: stable
        run: |
          # `|| true` is load-bearing. GitHub runs this with `bash -e`, so the
          # failing imagetools lookup aborted the step outright and the "nothing
          # to audit" branch below was unreachable -- the weekly audit reported
          # a red failure every run purely because :stable does not exist yet,
          # which is the ordinary pre-first-promotion state. A missing tag is a
          # skip, not an error; a genuine scan failure is still caught further
          # down, where it is a real finding rather than a bootstrap condition.
          #
          # `{{json .Manifest}}` + jq rather than `{{.Manifest.Digest}}`: a
          # buildx that does not know that field prints the entire inspect
          # block instead of failing, which would sail past the `-z` check
          # below as a "digest". See the same note in promote.yml.
          DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/zagware/zagware-scanner:stable \
            --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)

          if [ -z "$DIGEST" ]; then
            echo "No :stable tag found — nothing to audit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Stable digest: $DIGEST"

      - name: Scan with Grype
        if: steps.stable.outputs.skip != 'true'
        id: scan
        env:
          # Env var, not a ${{ }} interpolation into the script text, so the
          # run block stays extractable and executable verbatim by
          # tests/test_workflow_grype_gating.py.
          HAS_NEWER: ${{ steps.newer.outputs.value }}
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.stable.outputs.digest }}"

          set +e
          SCAN_JSON=$(grype "$IMAGE_REF" -o json 2>/tmp/grype-stderr.log)
          GRYPE_EXIT=$?
          set -e

          if [ "$GRYPE_EXIT" -ne 0 ] || ! echo "$SCAN_JSON" | jq -e '.matches | type == "array"' >/dev/null 2>&1; then
            echo "::error::Grype scan of $IMAGE_REF failed or returned unparseable output (exit $GRYPE_EXIT)."
            echo "::error::This is a SCAN FAILURE, not zero vulnerabilities — the audit cannot make a determination this run."
            cat /tmp/grype-stderr.log
            exit 1
          fi

          # Three numbers, because they answer three different questions.
          #
          #   total      — what the image carries. Always reported, never hidden.
          #   fixable    — a patched version exists SOMEWHERE upstream.
          #   actionable — a patched version exists in something WE pin.
          #
          # The alert fires on `actionable`, not `fixable`, for the same reason
          # promote.yml's gate does: 32 of the 50 critical/high in the
          # 2026-08-25 image were Go `stdlib` advisories compiled into
          # vendor-built binaries. Grype calls them fixed because Go shipped the
          # patch; nothing we can pin applies it — only Anchore's or
          # betterleaks' next release does. Alerting weekly on findings whose
          # only remedy is somebody else's release train is the same
          # always-red-alarm failure the fixable/unfixable split was introduced
          # to avoid, one level further in. tool-currency.yml is where those
          # live: it reports them per binary and escalates when the vendor
          # goes quiet.
          #
          # A vendored MODULE in a vendor binary counts as actionable only when
          # a newer release of that tool exists to bump to; on the newest
          # release there is nothing to bump and the finding is somebody else's
          # to ship.
          #
          # VENDOR_BINARIES is duplicated in promote.yml and pinned equal by
          # tests/test_workflow_grype_gating.py.
          VENDOR_BINARIES='["syft","grype","betterleaks","osv-scanner"]'

          NEWER_JSON="${HAS_NEWER:-}"
          [ -n "$NEWER_JSON" ] || NEWER_JSON='{}'

          # $owner is bound before the lookup: `index(.owner)` would read `.`
          # as the piped-in $vendors array and jq would abort the step.
          COUNTS=$(echo "$SCAN_JSON" \
            | jq -c --argjson vendors "$VENDOR_BINARIES" \
                   --argjson newer "$NEWER_JSON" '
            [ .matches[]
              | select(.vulnerability.severity | ascii_downcase | test("high|critical"))
              | (((.artifact.locations[0].path // "") | split("/") | last) // "") as $owner
              | { fixable: ((.vulnerability.fix.state // "") == "fixed"),
                  stdlib:  ((.artifact.name // "") == "stdlib"),
                  vendor:  (($vendors | index($owner)) != null),
                  bumpable: (($newer[$owner]) == true) } ]
            | { total:      length,
                fixable:    (map(select(.fixable)) | length),
                actionable: (map(select(.fixable
                                        and ((.vendor | not)
                                             or ((.stdlib | not) and .bumpable))))
                             | length) }')

          HIGH_COUNT=$(echo "$COUNTS" | jq -r '.total')
          FIXABLE_COUNT=$(echo "$COUNTS" | jq -r '.fixable')
          ACTIONABLE_COUNT=$(echo "$COUNTS" | jq -r '.actionable')

          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          echo "fixable_count=$FIXABLE_COUNT" >> "$GITHUB_OUTPUT"
          echo "actionable_count=$ACTIONABLE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $HIGH_COUNT HIGH/CRITICAL in :stable ($FIXABLE_COUNT with an upstream fix, $ACTIONABLE_COUNT actionable here)"

      - name: Open issue for new CVEs
        if: steps.stable.outputs.skip != 'true' && steps.scan.outputs.actionable_count != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const count = '${{ steps.scan.outputs.actionable_count }}';
            const fixable = '${{ steps.scan.outputs.fixable_count }}';
            const total = '${{ steps.scan.outputs.high_count }}';
            const digest = '${{ steps.stable.outputs.digest }}';

            // Check if an issue already exists for this digest
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,audit-cve'
            });

            const existing = issues.data.find(i => i.body && i.body.includes(digest));
            if (existing) {
              console.log(`Issue already exists: ${existing.html_url}`);
              return;
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Audit alert: ${count} actionable HIGH/CRITICAL CVEs in :stable (${digest.substring(0, 19)})`,
              body: `The weekly audit found **${count}** HIGH/CRITICAL vulnerabilities in the current :stable image that a base re-pin or a bundled-tool version bump would clear.\n\n${total} HIGH/CRITICAL in total, ${fixable} of them fixable somewhere upstream. The gap between ${fixable} and ${count} is Go \`stdlib\` compiled into a vendor-built binary: Grype reports a fix exists because Go published one, but only that vendor's next release applies it. Those are tracked weekly in the tool-currency issue, not here.\n\n**Digest:** \`${digest}\`\n\n**Action required:**\n- Review the vulnerabilities and determine if they affect the scanner's runtime safety\n- If critical, consider rolling :stable back to the prior known-good digest\n- Re-pin the base image or bump the affected tool and release a new version\n\nTo see the full scan results, run:\n\`\`\`bash\ngrype ghcr.io/zagware/zagware-scanner@${digest}\n\`\`\`\n\nTo see only what has an upstream fix:\n\`\`\`bash\ngrype ghcr.io/zagware/zagware-scanner@${digest} --only-fixed\n\`\`\``,
              labels: ['security', 'audit-cve']
            });

      - name: Audit summary
        if: steps.stable.outputs.skip != 'true'
        run: |
          echo "## Weekly Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Stable digest:** \`${{ steps.stable.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**HIGH/CRITICAL CVEs:** ${{ steps.scan.outputs.high_count }} (${{ steps.scan.outputs.fixable_count }} fixable upstream, ${{ steps.scan.outputs.actionable_count }} actionable here)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.scan.outputs.actionable_count }}" = "0" ]; then
            if [ "${{ steps.scan.outputs.high_count }}" = "0" ]; then
              echo "✅ No HIGH/CRITICAL vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ Nothing actionable — all ${{ steps.scan.outputs.high_count }} HIGH/CRITICAL findings await either an upstream patch or a vendor rebuild" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ ${{ steps.scan.outputs.actionable_count }} actionable HIGH/CRITICAL vulnerabilities found — issue opened" >> $GITHUB_STEP_SUMMARY
          fi
