# PR CI — lint + Docker build (no push) on every pull request to main.
# Provides status checks for branch protection.

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint + Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python syntax check
        run: python3 -m py_compile src/scanner.py

      - name: Check for common issues
        run: |
          # Ensure no shell=True in subprocess calls
          if grep -n "shell=True" src/scanner.py; then
            echo "ERROR: shell=True found in scanner.py — use list args for subprocess"
            exit 1
          fi
          # Ensure no mutable tag refs anywhere in this repo's workflows or
          # composite actions -- narrowly checking only publish.yml (the
          # original guard) let actions/github-script@v7 ship unpinned in
          # promote.yml and audit.yml, the two workflows that mutate
          # :stable/:secure and hold packages/contents/issues/id-token write
          # permissions in the same job environment. See SUP-13.
          if grep -rE 'uses: .*@v[0-9]' .github/workflows/ .github/actions/; then
            echo "ERROR: a workflow or composite action uses a mutable tag ref — pin to a commit SHA"
            exit 1
          fi
          echo "✓ Lint checks passed"

      - name: Set up test venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-test.txt

      - name: Run unit test suite
        # SUP-14: CI previously never ran a single line of scanner.py -- only
        # py_compile (proves it parses) plus a binary-existence check (proves
        # files are present). This is the actual "exercise the scanner" step:
        # every diff/render/suppression/severity/parity test built during this
        # review runs against every PR and every tag push.
        run: .venv/bin/python -m pytest tests/ -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: zagware-scanner:ci-test
          load: true

      - name: Verify scanner entrypoint
        run: |
          docker run --rm --entrypoint python3 zagware-scanner:ci-test -c "import py_compile; py_compile.compile('/usr/local/bin/zagware-scan', doraise=True); print('✓ scanner.py compiles in container')"

      - name: Verify binaries exist
        run: |
          docker run --rm --entrypoint sh zagware-scanner:ci-test -c '
            for bin in /usr/local/bin/kics /usr/bin/syft /usr/bin/grype /usr/local/bin/betterleaks; do
              if [ ! -x "$bin" ]; then echo "ERROR: $bin not found"; exit 1; fi
              echo "✓ $bin"
            done
          '

      - name: Smoke test — run each engine against a real, known-bad fixture
        # SUP-14: existence + py_compile catch neither a broken/non-functional
        # binary (wrong arch, missing shared lib, corrupt download) nor an
        # empty KICS query tree, and prove nothing about whether the four
        # engines actually produce findings. This step invokes each engine
        # with the EXACT flags src/scanner.py itself uses (run_scan(),
        # _run_syft(), _run_grype(), run_secrets_scan()) against fixtures each
        # engine is guaranteed to flag, and fails the build if any of them
        # comes back empty.
        run: |
          docker run --rm --entrypoint sh zagware-scanner:ci-test -c '
            set -e
            echo "--- version checks ---"
            kics version
            syft version
            grype version
            betterleaks version

            QCOUNT=$(ls /opt/iac-rules/assets/queries | wc -l)
            echo "KICS query platforms: $QCOUNT"
            if [ "$QCOUNT" -lt 5 ]; then echo "ERROR: KICS query tree looks empty ($QCOUNT platform dirs)"; exit 1; fi

            mkdir -p /tmp/work /tmp/out
            cd /tmp/work

            # Real KICS finding: SSH open to the world -- caught by every
            # Terraform IaC scanner, including every KICS version in range.
            printf "resource \"aws_security_group\" \"bad\" {\n  name = \"smoke-test\"\n  ingress {\n    from_port   = 22\n    to_port     = 22\n    protocol    = \"tcp\"\n    cidr_blocks = [\"0.0.0.0/0\"]\n  }\n}\n" > main.tf

            # Real Grype finding: an old, CVE-laden lodash pin. Syft's npm
            # cataloger needs a real lockfile -- a bare package.json (with no
            # package-lock.json) yields zero packages, discovered by actually
            # running this against a real build rather than trusting a stub.
            printf "{\"name\":\"smoke-test\",\"version\":\"1.0.0\",\"lockfileVersion\":3,\"requires\":true,\"packages\":{\"\":{\"name\":\"smoke-test\",\"version\":\"1.0.0\",\"dependencies\":{\"lodash\":\"4.17.15\"}},\"node_modules/lodash\":{\"version\":\"4.17.15\",\"resolved\":\"https://registry.npmjs.org/lodash/-/lodash-4.17.15.tgz\",\"integrity\":\"sha512-8xOcRHvCjnocdS5cpwXQXVzmmh5e5+saE2QGoeQmbKmRS6J3VQppPOIt0MnmE+4xlZoumy0GPG0D0MVIQbNA1A==\"}}}\n" > package-lock.json

            # Real betterleaks finding: a PEM private-key block. AWS's own
            # published EXAMPLE key id (a common smoke-test placeholder) is
            # NOT usable here -- gitleaks-family scanners, betterleaks
            # included, allowlist it by default (confirmed against the real
            # bundled binary: 0 findings). A private-key block is not.
            printf -- "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA1c7+9z5Pad7OejecsQ0bu3aumqCLQPTGorAdc7OZ2ZfEqYCu\nQXn5UokEz2fXVXKa1LOhbFtMdlsPqz1JcRVUeuVLFqYAe6xppfF5wLIVs0ARfOb+\nEXAMPLEFAKEKEYCONTENTFOROURSMOKETESTINGONLY123456789NOTREALDATA\n-----END RSA PRIVATE KEY-----\n" > id_rsa

            echo "--- KICS scan (expect >=1 finding) ---"
            kics scan --path . --queries-path /opt/iac-rules/assets/queries \
              --report-formats json --output-path /tmp/out --output-name kics \
              --exclude-paths .git --disable-full-descriptions --no-progress --ci || true
            KFOUND=$(python3 -c "import json; d=json.load(open(\"/tmp/out/kics.json\")); print(sum(len(q[\"files\"]) for q in d.get(\"queries\", [])))")
            echo "KICS findings: $KFOUND"
            if [ "$KFOUND" -lt 1 ]; then echo "ERROR: KICS found 0 findings against a fixture with an open-SSH security group"; exit 1; fi

            echo "--- Syft (SBOM generation) ---"
            syft scan dir:. -o syft-json=/tmp/out/sbom.json --quiet
            PKGCOUNT=$(python3 -c "import json; print(len(json.load(open(\"/tmp/out/sbom.json\")).get(\"artifacts\", [])))")
            echo "Syft packages: $PKGCOUNT"
            if [ "$PKGCOUNT" -lt 1 ]; then echo "ERROR: Syft found 0 packages in a fixture with a package-lock.json"; exit 1; fi

            echo "--- Grype (vulnerability matching) ---"
            grype sbom:/tmp/out/sbom.json -o json --quiet > /tmp/out/grype.json
            VULNCOUNT=$(python3 -c "import json; print(len(json.load(open(\"/tmp/out/grype.json\")).get(\"matches\", [])))")
            echo "Grype matches: $VULNCOUNT"
            if [ "$VULNCOUNT" -lt 1 ]; then echo "ERROR: Grype found 0 vulnerabilities against a fixture pinning lodash 4.17.15"; exit 1; fi

            echo "--- betterleaks (secret detection) ---"
            betterleaks dir . --report-path /tmp/out/secrets.json --report-format json \
              --exit-code 0 --no-color --no-banner
            SECRETCOUNT=$(python3 -c "import json; d=json.load(open(\"/tmp/out/secrets.json\")); print(len(d) if d else 0)")
            echo "betterleaks findings: $SECRETCOUNT"
            if [ "$SECRETCOUNT" -lt 1 ]; then echo "ERROR: betterleaks found 0 secrets against a fixture with a PEM private-key block"; exit 1; fi

            echo "✓ All four engines executed and produced real findings against known-bad fixtures"
          '
