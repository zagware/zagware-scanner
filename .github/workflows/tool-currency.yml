# Watches the five bundled scanner binaries and the three base images for
# staleness, and reports in one continuously-updated issue.
#
# Two distinct triggers, because "a newer version exists" and "we are stuck on
# something rotting" are different problems with different responses:
#
#   BEHIND    upstream published a newer release than we pin. Routine: bump,
#             re-checksum, release.
#
#   ESCALATE  our pinned build carries fixable CRITICAL/HIGH CVEs *and* upstream
#             has not published in STALE_DAYS. This is the condition that
#             justifies building a tool from source instead of consuming its
#             release, and it is the one nobody notices by eye. Checkmarx hit it
#             months before we did anything: KICS shipped no usable binary after
#             v2.1.20 while its vendored dependencies aged, and we only found
#             out by reading a CVE report by hand.
#
# The escalation criteria are deliberately narrow. Building from source trades
# away a real control -- Anchore and betterleaks sign their releases with
# keyless cosign, verified in publish.yml before the image is built, and a
# source build replaces that cryptographic attribution with a bare commit SHA.
# We took that trade for KICS because there was no binary to verify and their
# release pipeline had been compromised (TeamPCP). It is an escalation, not a
# default. See "Keeping the tools current" in README.md.
#
# Read-only: this workflow never edits pins. It reports; a human decides.

name: Tool currency

on:
  schedule:
    # Mondays 07:47 UTC -- the morning after publish.yml's Sunday base refresh,
    # so CVE attribution measures the freshest image. Off the hour, where
    # GitHub delays scheduled runs least.
    - cron: '47 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Days without an upstream release before a CVE-carrying tool is escalated.
  # 90 is deliberately patient: a quiet month is normal for a mature scanner,
  # a quiet quarter while shipping known-vulnerable dependencies is not.
  STALE_DAYS: 90
  # Image the CVE attribution is measured against. :stable first -- that asks
  # "what are users actually running" -- falling back to :latest, which is all
  # that exists until a release completes its first promotion cycle.
  IMAGE: ghcr.io/zagware/zagware-scanner:stable
  FALLBACK_IMAGE: ghcr.io/zagware/zagware-scanner:latest

jobs:
  currency:
    name: Check upstream releases and CVE attribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write   # open/update the single currency issue

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install-grype

      - name: Read pinned versions from Dockerfile
        run: sed -n 's/^ARG //p' Dockerfile >> "$GITHUB_ENV"

      # ── Which of our pins are behind upstream? ────────────────────────────
      - name: Compare pins against upstream releases
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # where|pinned|label|origin. `origin` says where a newer version
          # comes from and what the report may recommend:
          #   binary  vendor-built release binary, looked up as a GitHub release
          #   source  GitHub release we compile ourselves (see the escalation
          #           rule in the issue step)
          #   gomod   Go module we `go install`, looked up on proxy.golang.org
          # KICS is compared by tag even though we build it from source: the
          # question "is there a newer KICS" is unchanged by how we obtain it.
          #
          # osv-scanner belongs here for the same reason as the rest -- it is a
          # pinned third-party binary in BOTH published images -- and it was
          # missing until the 2026-08-25 review, which is how its pin sat at
          # v2.4.0 for 68 days, two releases behind, carrying 11 critical/high,
          # the worst of any bundled tool, with nothing reporting it.
          # govulncheck was missing the same way: pinned at v1.1.4 in the
          # reachability image while golang.org/x/vuln reached v1.9.0. Its
          # GitHub mirror still marks a stale v1.1.4 *release* as latest, so a
          # release lookup would have called it current; the module proxy is
          # the authority for a module.
          TOOLS=$(cat <<EOF
          Checkmarx/kics|v${KICS_VERSION}|KICS|source
          anchore/syft|${SYFT_VERSION}|Syft|binary
          anchore/grype|${GRYPE_VERSION}|Grype|binary
          betterleaks/betterleaks|v${BETTERLEAKS_VERSION}|betterleaks|binary
          google/osv-scanner|${OSV_SCANNER_VERSION}|osv-scanner|binary
          golang.org/x/vuln|${GOVULNCHECK_VERSION}|govulncheck|gomod
          EOF
          )

          echo "[]" > /tmp/tools.json
          NOW=$(date -u +%s)

          while IFS='|' read -r repo pinned label origin; do
            [ -n "$repo" ] || continue

            if [ "$origin" = gomod ]; then
              MOD=$(curl -fsS "https://proxy.golang.org/${repo}/@latest" 2>/dev/null || echo "{}")
              LATEST=$(printf '%s' "$MOD" | jq -r '.Version // empty')
              PUBLISHED=$(printf '%s' "$MOD" | jq -r '.Time // empty')
              ASSETS=0   # nothing to download; `go install` builds it
            else
              # Latest release by tag. Falls back to the highest semver tag
              # when a project stops cutting releases -- which is exactly the
              # KICS failure mode, so treating "no releases" as "up to date"
              # would hide it. Highest by `sort -V`, not the tags API's first
              # entry, whose order is not a version order.
              LATEST=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
              if [ -z "$LATEST" ]; then
                LATEST=$(gh api "repos/${repo}/tags?per_page=100" --jq '.[].name' 2>/dev/null \
                           | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
              fi
              PUBLISHED=$(gh api "repos/${repo}/releases/latest" --jq '.published_at' 2>/dev/null || echo "")
              # Does the newest release actually ship a linux_amd64 artifact? A
              # tag with no binaries is the precise thing that stranded us on
              # KICS v2.1.20, and it is invisible from a version number alone.
              ASSETS=$(gh api "repos/${repo}/releases/latest" \
                         --jq '[.assets[].name | select(test("linux[_-]amd64|linux_x64"))] | length' \
                         2>/dev/null || echo 0)
            fi
            [ -n "$LATEST" ] || LATEST="unknown"

            # Date of that release, for the staleness clock. AGE is -1 whenever
            # it cannot be established -- never a number derived from a failed
            # parse. `|| echo 0` here made PUB_TS=0 and AGE became days-since-
            # epoch (~20,669), which reads as catastrophically stale and would
            # have escalated every tool on any runner whose `date` lacks GNU
            # `-d`. Same fabricated-fallback class SUP-01 removed from the CVE
            # gates; caught by dry-running this on a BSD `date`.
            PUB_TS=""
            if [ -n "$PUBLISHED" ]; then
              PUB_TS=$(date -u -d "$PUBLISHED" +%s 2>/dev/null || echo "")
            fi
            if [ -n "$PUB_TS" ] && [ "$PUB_TS" -gt 0 ] 2>/dev/null; then
              AGE=$(( (NOW - PUB_TS) / 86400 ))
            else
              AGE=-1   # unknown, and reported as unknown -- not as fresh, not as stale
            fi

            BEHIND=false
            [ "$pinned" != "$LATEST" ] && BEHIND=true

            jq -c --arg repo "$repo" --arg label "$label" --arg pinned "$pinned" \
                  --arg latest "$LATEST" --argjson age "$AGE" \
                  --argjson assets "${ASSETS:-0}" --argjson behind "$BEHIND" \
                  --argjson source "$([ "$origin" = binary ] && echo false || echo true)" \
              '. += [{repo:$repo,label:$label,pinned:$pinned,latest:$latest,
                      age_days:$age,linux_assets:$assets,behind:$behind,
                      source:$source}]' \
              /tmp/tools.json > /tmp/tools.next && mv /tmp/tools.next /tmp/tools.json
          done <<< "$TOOLS"

          echo "Upstream comparison:"
          jq -r '.[] | "  \(.label): pinned=\(.pinned) latest=\(.latest) age=\(.age_days)d assets=\(.linux_assets)"' /tmp/tools.json

      # ── Which binary owns each unfixed CVE? ───────────────────────────────
      - name: Attribute CVEs in the shipped image to their owning binary
        id: cves
        run: |
          set -euo pipefail

          # :stable is preferred -- it asks "what are users actually running".
          # But it does not exist until a release completes its first promotion
          # cycle, and without CVE data the escalation signal cannot fire at
          # all. Falling back to :latest keeps the check live from day one;
          # the first real run found exactly this gap. Which image was measured
          # is recorded so the report is never ambiguous about its own basis.
          SCANNED=""
          for ref in "$IMAGE" "$FALLBACK_IMAGE"; do
            if grype -q "$ref" -o json --file /tmp/img.json 2>/dev/null; then
              SCANNED="$ref"; break
            fi
            echo "::notice::${ref} could not be scanned — trying the next candidate."
          done

          if [ -z "$SCANNED" ]; then
            echo "::warning::Neither ${IMAGE} nor ${FALLBACK_IMAGE} could be scanned — reporting upstream drift only."
            echo '{}' > /tmp/cves.json
            echo "none" > /tmp/scanned_ref.txt
            exit 0
          fi
          echo "$SCANNED" > /tmp/scanned_ref.txt
          echo "CVE attribution measured against ${SCANNED}"

          # Count CRITICAL/HIGH per owning binary, split by whether a fix even
          # exists. Only *fixable* findings can escalate: two containerd
          # advisories with no upstream patch are not a reason to fork a build,
          # and counting them would make the signal permanent noise.
          jq '[ .matches[]
                | select(.vulnerability.severity | ascii_downcase
                         | test("critical|high"))
                | { owner: ((.artifact.locations[0].path // "unknown")
                            | split("/") | last),
                    fixable: ((.vulnerability.fix.state // "") == "fixed") } ]
              | group_by(.owner)
              | map({ key: .[0].owner,
                      value: { total: length,
                               fixable: (map(select(.fixable)) | length) } })
              | from_entries' /tmp/img.json > /tmp/cves.json

          echo "CVE attribution (critical/high):"
          jq -r 'to_entries[] | "  \(.key): \(.value.total) total, \(.value.fixable) fixable"' /tmp/cves.json

      # ── Are the pinned base image digests still pullable? ─────────────────
      - name: Check base image digests still resolve
        id: bases
        run: |
          set -euo pipefail
          # Chainguard's free tier publishes only :latest and garbage-collects
          # older digests, so a pinned Wolfi digest can become unpullable and
          # break the build with no code change. Debian and the Go toolchain do
          # not GC this way, but they are checked identically -- a pin that
          # cannot be fetched is the same outage whatever the registry's policy.
          #
          # Three states, not two. A failed lookup does NOT mean the digest is
          # gone: on 2026-08-24 this reported BOTH Docker Hub pins as
          # UNPULLABLE and told a human "the next build will fail", while an
          # authenticated registry HEAD showed both digests present and
          # returning 200. Reporting a failed lookup as a dead pin is the same
          # fabricated-answer class SUP-01 removed from the CVE gates: a failed
          # lookup is "unknown", and it must say so.
          #
          # A registry HEAD on the manifest, not `docker manifest inspect`.
          # That command never got an answer for the two Docker Hub pins: it
          # GETs the manifest (which Docker Hub meters against the shared
          # runner IP's anonymous pull limit) and then re-verifies the digest
          # client-side, failing with "manifest verification failed for
          # digest" even when the registry served it -- so Debian and Go were
          # reported UNRESOLVED every week and never actually checked. A HEAD
          # is not metered, and its status code IS the registry's answer:
          # 200 present, 404 gone, anything else unknown.
          echo "[]" > /tmp/bases.json
          check() {
            local name="$1" registry="$2" repo="$3" digest="$4"
            local challenge realm service token code S detail
            local auth=()
            # Anonymous bearer token, from whatever realm the registry names.
            challenge=$(curl -sS -o /dev/null -D - "https://${registry}/v2/" 2>/dev/null \
                          | tr -d '\r' | grep -i '^www-authenticate:' || true)
            realm=$(printf '%s' "$challenge" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
            service=$(printf '%s' "$challenge" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
            if [ -n "$realm" ]; then
              token=$(curl -fsS --get "$realm" \
                        --data-urlencode "service=${service}" \
                        --data-urlencode "scope=repository:${repo}:pull" 2>/dev/null \
                        | jq -r '.token // .access_token // empty' || true)
              [ -z "$token" ] || auth=(-H "Authorization: Bearer ${token}")
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' -I "${auth[@]}" \
                     -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                     "https://${registry}/v2/${repo}/manifests/${digest}" 2>/dev/null || true)
            case "$code" in
              200) S=ok;         detail="" ;;
              404) S=UNPULLABLE; detail="HTTP 404 from ${registry}: manifest unknown" ;;
              *)   S=UNRESOLVED; detail="HTTP ${code:-000} from ${registry}: no answer about the digest" ;;
            esac
            echo "  $name: $S${detail:+ -- $detail}"
            jq -c --arg n "$name" --arg s "$S" --arg e "$detail" \
              '. += [{name:$n,status:$s,detail:$e}]' \
              /tmp/bases.json > /tmp/b.next && mv /tmp/b.next /tmp/bases.json
          }
          echo "Base image pins:"
          check "Wolfi (runtime)"                "cgr.dev"              "chainguard/wolfi-base" "$WOLFI_DIGEST"
          check "Debian (builder)"               "registry-1.docker.io" "library/debian"        "$DEBIAN_DIGEST"
          check "Go ${GO_VERSION} (kics build)"  "registry-1.docker.io" "library/golang"        "$GO_DIGEST"

      - name: Open or update the currency issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const tools  = JSON.parse(fs.readFileSync('/tmp/tools.json', 'utf8'));
            const cves   = JSON.parse(fs.readFileSync('/tmp/cves.json', 'utf8'));
            const bases  = JSON.parse(fs.readFileSync('/tmp/bases.json', 'utf8'));
            const stale  = parseInt(process.env.STALE_DAYS, 10);
            const scanned = fs.existsSync('/tmp/scanned_ref.txt')
              ? fs.readFileSync('/tmp/scanned_ref.txt', 'utf8').trim() : 'none';

            // Map a repo label to the binary name grype attributes CVEs to.
            const binaryOf = { KICS: 'kics', Syft: 'syft', Grype: 'grype',
                               betterleaks: 'betterleaks',
                               'osv-scanner': 'osv-scanner',
                               govulncheck: 'govulncheck' };

            const rows = [], escalations = [], behind = [], ours = [];
            for (const t of tools) {
              const c = cves[binaryOf[t.label]] || { total: 0, fixable: 0 };
              const noAssets = !t.source && t.linux_assets === 0;
              // age_days === -1 means the release date could not be resolved.
              // Treated as escalating (fail closed, consistent with the rest of
              // this repo's gates) but reported honestly as unknown rather than
              // as a day count we do not have.
              const unknownAge = t.age_days < 0;
              const isStale    = t.age_days > stale || unknownAge;
              // The escalation recommends building from source, which is
              // meaningless for a tool we already build from source -- KICS
              // sat permanently "escalated" for having no release binary we
              // do not use. For those, a fixable finding is ours to clear with
              // a module override or a toolchain bump, and says so instead.
              const escalate   = !t.source && c.fixable > 0 && (isStale || noAssets);

              if (t.behind) behind.push(t.label);
              if (escalate) escalations.push({ ...t, ...c, noAssets, unknownAge });
              if (t.source && c.fixable > 0) ours.push({ ...t, ...c });

              rows.push(`| ${t.label} | \`${t.pinned}\` | \`${t.latest}\` | ` +
                        `${t.behind ? '**yes**' : 'no'} | ` +
                        `${t.age_days < 0 ? '?' : t.age_days + 'd'} | ` +
                        `${t.source ? 'n/a (source build)' : noAssets ? '**none**' : t.linux_assets} | ` +
                        `${c.total} (${c.fixable} fixable) | ` +
                        `${escalate ? '🔴 **escalate**' : t.source && c.fixable > 0 ? '🟠 **ours**' : 'ok'} |`);
            }

            const deadBases    = bases.filter(b => b.status === 'UNPULLABLE');
            const unknownBases = bases.filter(b => b.status === 'UNRESOLVED');

            let body = `_Automated weekly check. This workflow never edits pins — it reports._\n\n`;
            body += scanned === 'none'
              ? `> ⚠️ No image could be scanned, so the CVE column is empty and the ` +
                `escalation signal is inactive this run. Upstream drift below is still accurate.\n\n`
              : `_CVE columns measured against \`${scanned}\`._\n\n`;
            body += `## Bundled tools\n\n`;
            body += `| Tool | Pinned | Latest upstream | Behind | Since release | linux/amd64 assets | Crit+High | |\n`;
            body += `|---|---|---|---|---|---|---|---|\n${rows.join('\n')}\n\n`;

            if (escalations.length) {
              body += `## 🔴 Escalation: consider building from source\n\n`;
              body += `These carry **fixable** critical/high CVEs while upstream has gone quiet `;
              body += `(no release in ${stale}d) or has stopped shipping linux/amd64 binaries. `;
              body += `That is the specific condition under which a source build is worth its cost — `;
              body += `see "Keeping the tools current" in the README before acting, because it means `;
              body += `giving up the vendor's release signature.\n\n`;
              for (const e of escalations) {
                const why = e.noAssets
                  ? `latest release ships **no linux/amd64 asset**`
                  : e.unknownAge
                    ? `upstream release date could not be resolved`
                    : `no upstream release in ${e.age_days} days`;
                body += `- **${e.label}** — ${e.fixable} fixable crit/high; ${why}\n`;
              }
              body += `\n`;
            }

            if (ours.length) {
              body += `## 🟠 Source-built tools carrying fixable CVEs\n\n`;
              body += `We compile these, so no vendor release is needed: bump the vulnerable `;
              body += `module with a \`go get\` override in the Dockerfile's build stage, or `;
              body += `bump \`GO_VERSION\` for \`stdlib\` findings. promote.yml blocks on these.\n\n`;
              for (const o of ours) body += `- **${o.label}** — ${o.fixable} fixable crit/high\n`;
              body += `\n`;
            }

            if (deadBases.length) {
              body += `## 🔴 Base image pin unresolvable\n\n`;
              body += `The registry answered, and the digest is gone — the next build will fail.\n\n`;
              for (const b of deadBases) body += `- **${b.name}**: ${b.detail || b.status}\n`;
              body += `\n`;
            }

            if (unknownBases.length) {
              body += `## ⚠️ Base image pin not checked this run\n\n`;
              body += `The registry did not answer the manifest HEAD (rate limit, auth `;
              body += `failure, DNS or timeout), so nothing is known about these digests `;
              body += `either way. This is reported rather than counted as a dead pin, `;
              body += `because guessing is how a transient failure gets read as an outage.\n\n`;
              for (const b of unknownBases) body += `- **${b.name}**: ${b.detail || b.status}\n`;
              body += `\n`;
            }

            if (!behind.length && !escalations.length && !ours.length && !deadBases.length && !unknownBases.length) {
              body += `✅ Everything pinned is current, every pin resolves, and nothing is `;
              body += `carrying fixable CVEs against a stale upstream.\n`;
            }

            body += `\n<sub>Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}</sub>`;

            const TITLE = 'Tool currency: bundled scanners and base images';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,tool-currency',
            });

            // One long-lived issue, edited in place. A weekly cron that opens a
            // fresh issue trains everyone to close them unread.
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
              core.info(`Updated issue #${existing.data[0].number}`);
            } else if (behind.length || escalations.length || ours.length || deadBases.length || unknownBases.length) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: ['security', 'tool-currency'],
              });
              core.info(`Opened issue #${created.data.number}`);
            } else {
              core.info('Everything current — no issue opened.');
            }

            await core.summary.addRaw(body).write();
