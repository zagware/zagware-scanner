# Promotes the :latest image to :stable and :secure after a 14-day cooling period
# and a clean CVE scan. Runs daily via cron, or manually via workflow_dispatch.
#
# Tag semantics:
#   :<version>  — immutable per release
#   :latest     — newest release (not security-vetted)
#   :stable     — promoted from :latest after 14-day cooling + clean CVE scan
#   :secure     — identical digest to :stable (security-audited marker)
#
# If CVEs are found during promotion, a GitHub issue is opened and promotion is blocked.

name: Promote to Stable

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (e.g. 2.2.0). Leave empty to auto-detect.'
        required: false
        default: ''

jobs:
  promote:
    name: Promote latest → stable
    runs-on: ubuntu-latest
    permissions:
      contents: read        # no step writes repository contents
      packages: write       # re-tag images
      id-token: write       # OIDC for the promotion attestation (cosign verify needs no token of its own)
      attestations: write   # promotion attestation
      issues: write         # open blocked-promotion issues

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Grype
        uses: ./.github/actions/install-grype

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Re-tagging :latest -> :stable is a registry WRITE, so it depends on the
      # same repo-level Write grant on the container package that publish.yml
      # documents. This path has still never actually run: every scheduled run
      # so far skipped on the cooling-period gate, and :stable does not yet
      # exist. The first real promotion is what proves it.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest tag digest and age
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the manifest digest of :latest
          LATEST_DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/zagware/zagware-scanner:latest \
            --format '{{.Manifest.Digest}}' 2>/dev/null)

          if [ -z "$LATEST_DIGEST" ]; then
            echo "No :latest tag found — nothing to promote"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "digest=$LATEST_DIGEST" >> "$GITHUB_OUTPUT"

          # Age must be measured against the digest we just resolved from the
          # registry -- NOT against whichever version the API happens to report
          # as tagged :latest. The 14-day cooling period is the load-bearing
          # guarantee of the whole rollout design; measuring it against a
          # different image silently voids it. See SUP-18.
          VERSIONS_JSON=$(curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/zagware/packages/container/zagware-scanner/versions?per_page=100") || VERSIONS_JSON=""

          if [ -z "$VERSIONS_JSON" ] || ! printf '%s' "$VERSIONS_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::Could not list container versions from the GitHub API -- the 14-day cooling period for ${LATEST_DIGEST} cannot be verified, so promotion fails closed rather than guessing an age. See SUP-18."
            exit 1
          fi

          TAG_DATES=$(printf '%s' "$VERSIONS_JSON" \
            | jq -r --arg digest "${LATEST_DIGEST#sha256:}" \
              '.[] | select(.name == "sha256:" + $digest) | .created_at')
          MATCH_COUNT=$(printf '%s\n' "$TAG_DATES" | grep -c '[^[:space:]]' || true)

          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one GHCR version with digest ${LATEST_DIGEST}, found ${MATCH_COUNT}. Zero means the registry and the packages API disagree (or the version is beyond the first 100 results); more than one means the creation date is ambiguous. Either way the cooling period cannot be measured, so promotion fails closed. See SUP-18."
            exit 1
          fi

          TAG_DATE="$TAG_DATES"

          # GNU date only -- these workflows only ever run on ubuntu-latest, and
          # the old BSD `date -jf` fallback could never have fired there.
          TAG_TS=$(date -u -d "$TAG_DATE" +%s) || TAG_TS=""
          if [ -z "$TAG_TS" ]; then
            echo "::error::Could not parse the creation date '${TAG_DATE}' reported for ${LATEST_DIGEST} -- failing closed. See SUP-18."
            exit 1
          fi

          NOW_TS=$(date -u +%s)
          AGE_DAYS=$(( (NOW_TS - TAG_TS) / 86400 ))

          echo "Latest digest: $LATEST_DIGEST"
          echo "Latest tag age: ${AGE_DAYS} days"

          # Read the digest :stable currently points at. This is both the
          # "already promoted?" check and the only record of the digest this
          # run is about to overwrite -- without it a maintainer has to
          # reconstruct the previous :stable from GHCR version history by hand
          # under incident pressure. Recorded (not acted on) below: audit.yml
          # alerts, rollback stays a deliberate manual decision. See SUP-17.
          STABLE_DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/zagware/zagware-scanner:stable \
            --format '{{.Manifest.Digest}}' 2>/dev/null || echo "")

          echo "previous_stable_digest=$STABLE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Current :stable digest (will be replaced): ${STABLE_DIGEST:-<none>}"

          if [ "$STABLE_DIGEST" = "$LATEST_DIGEST" ]; then
            echo ":stable already points to this digest — nothing to promote"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$AGE_DAYS" -lt 14 ]; then
            echo "Latest tag is only ${AGE_DAYS} days old — needs 14-day cooling period"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "age_days=$AGE_DAYS" >> "$GITHUB_OUTPUT"

      - name: Verify :latest image signature
        if: steps.latest.outputs.skip != 'true'
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.latest.outputs.digest }}"
          echo "Verifying $IMAGE_REF carries a valid signature from this repo's publish workflow..."
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "^https://github.com/zagware/zagware-scanner/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "✓ Signature verified — $IMAGE_REF was built and signed by this repo's publish workflow"

      - name: Skip promotion
        if: steps.latest.outputs.skip == 'true'
        run: echo "Skipping promotion — see previous step output for reason."

      - name: Scan image for CVEs (Grype)
        if: steps.latest.outputs.skip != 'true'
        id: scan
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.latest.outputs.digest }}"
          echo "Scanning $IMAGE_REF for CVEs..."

          set +e
          SCAN_JSON=$(grype "$IMAGE_REF" -o json 2>/tmp/grype-stderr.log)
          GRYPE_EXIT=$?
          set -e

          if [ "$GRYPE_EXIT" -ne 0 ] || ! echo "$SCAN_JSON" | jq -e '.matches | type == "array"' >/dev/null 2>&1; then
            echo "::error::Grype scan of $IMAGE_REF failed or returned unparseable output (exit $GRYPE_EXIT)."
            echo "::error::This is a SCAN FAILURE, not a clean result — promotion cannot proceed without a real answer."
            cat /tmp/grype-stderr.log
            exit 1
          fi

          HIGH_COUNT=$(echo "$SCAN_JSON" | jq '[.matches[] | select(.vulnerability.severity | ascii_downcase | test("high|critical"))] | length')

          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$HIGH_COUNT" != "0" ]; then
            echo "Found $HIGH_COUNT HIGH/CRITICAL vulnerabilities — promotion blocked"
            echo "scan_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No HIGH/CRITICAL vulnerabilities found — safe to promote"
            echo "scan_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue for blocked promotion
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const count = '${{ steps.scan.outputs.high_count }}';
            const digest = '${{ steps.latest.outputs.digest }}';

            // Check if a blocked-promotion issue already exists for this digest —
            // without this, once the 14-day cooling period elapses this workflow
            // runs daily via cron and would otherwise file a fresh issue every
            // single day the image remains vulnerable. See SUP-03.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,promotion-blocked'
            });

            const existing = issues.data.find(i => i.body && i.body.includes(digest));
            if (existing) {
              console.log(`Blocked-promotion issue already exists: ${existing.html_url}`);
              return;
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Promotion blocked: ${digest} has ${count} HIGH/CRITICAL CVEs`,
              body: `The promotion of \`ghcr.io/zagware/zagware-scanner@${digest}\` to :stable was blocked because Grype found ${count} HIGH/CRITICAL vulnerabilities.\n\nThe image remains on :latest. Once the CVEs are resolved (either by patching the base image or bumping affected packages), re-run this workflow to retry promotion.`,
              labels: ['security', 'promotion-blocked']
            });

      - name: Promote to stable and secure
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        run: |
          DIGEST="${{ steps.latest.outputs.digest }}"

          echo "Promoting $DIGEST to :stable and :secure..."

          # Re-tag :stable → @digest (no rebuild — just copies the manifest pointer)
          docker buildx imagetools create \
            --tag ghcr.io/zagware/zagware-scanner:stable \
            "ghcr.io/zagware/zagware-scanner@${DIGEST}"

          # Re-tag :secure → @digest (same digest as :stable)
          docker buildx imagetools create \
            --tag ghcr.io/zagware/zagware-scanner:secure \
            "ghcr.io/zagware/zagware-scanner@${DIGEST}"

          echo "✓ Promoted to :stable and :secure"

      - name: Build promotion predicate
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        run: |
          # replacedDigest is the rollback record: audit.yml can only alert,
          # and nothing else in the repo archives the digest :stable pointed at
          # before this run overwrote it. Putting it in the signed promotion
          # predicate means the value survives log retention. See SUP-17.
          jq -n \
            --arg digest "${{ steps.latest.outputs.digest }}" \
            --arg replaced_digest "${{ steps.latest.outputs.previous_stable_digest }}" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg cooling_period_days "${{ steps.latest.outputs.age_days }}" \
            --arg high_critical_count "${{ steps.scan.outputs.high_count }}" \
            --arg workflow_run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              digest: $digest,
              replacedDigest: (if $replaced_digest == "" then null else $replaced_digest end),
              promotedAt: $promoted_at,
              promotedTags: ["stable", "secure"],
              sourceTag: "latest",
              coolingPeriodDays: ($cooling_period_days | tonumber),
              cveScan: {
                tool: "grype",
                highOrCriticalCount: ($high_critical_count | tonumber)
              },
              workflowRun: $workflow_run
            }' > /tmp/promotion-predicate.json

      - name: Attest promotion
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2
        with:
          subject-name: ghcr.io/zagware/zagware-scanner
          subject-digest: ${{ steps.latest.outputs.digest }}
          predicate-type: https://zagware.io/attestations/promotion/v1
          predicate-path: /tmp/promotion-predicate.json

      - name: Promotion summary
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        env:
          PREVIOUS_STABLE_DIGEST: ${{ steps.latest.outputs.previous_stable_digest }}
        run: |
          echo "## Promoted to :stable and :secure" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.latest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cooling period:** ${{ steps.latest.outputs.age_days }} days" >> $GITHUB_STEP_SUMMARY
          echo "**CVE scan:** Clean (0 HIGH/CRITICAL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Rollback record. audit.yml alerts but cannot re-tag, and nothing
          # else archives the digest :stable pointed at before this run. See
          # SUP-17. Rollback stays a deliberate manual action.
          if [ -n "$PREVIOUS_STABLE_DIGEST" ]; then
            echo "**Previous :stable digest (replaced by this run):** \`${PREVIOUS_STABLE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To roll back manually:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker buildx imagetools create --tag ghcr.io/zagware/zagware-scanner:stable \\" >> $GITHUB_STEP_SUMMARY
            echo "  ghcr.io/zagware/zagware-scanner@${PREVIOUS_STABLE_DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo "docker buildx imagetools create --tag ghcr.io/zagware/zagware-scanner:secure \\" >> $GITHUB_STEP_SUMMARY
            echo "  ghcr.io/zagware/zagware-scanner@${PREVIOUS_STABLE_DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "**Previous :stable digest:** none — this is the first promotion, so there is nothing to roll back to." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ghcr.io/zagware/zagware-scanner:stable \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
