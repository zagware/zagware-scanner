# Promotes the :latest image to :stable and :secure after a cooling period and
# a clean CVE scan. Runs daily via cron, or manually via workflow_dispatch.
#
# Tag semantics:
#   :<version>  — immutable per release
#   :latest     — newest release (not security-vetted)
#   :stable     — promoted from :latest after COOLING_DAYS + clean CVE scan
#   :secure     — identical digest to :stable (security-audited marker)
#
# The cooling period is COOLING_DAYS below -- one value, referenced everywhere,
# because it used to be the literal 14 repeated in six places including three
# operator-facing error strings, which is how a gate and its own error message
# drift apart.
#
# If CVEs are found during promotion, a GitHub issue is opened and promotion is blocked.

name: Promote to Stable

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (e.g. 2.2.0). Leave empty to auto-detect.'
        required: false
        default: ''

env:
  # Days a RELEASE must age before its image can be promoted. Lowered 14 -> 7:
  # the window exists to let a regression surface in real pipelines before an
  # image is blessed, and in practice breakage has shown up within hours to a
  # day or two, not weeks.
  #
  # The clock runs on the release, NOT on the candidate digest, and that
  # distinction is the whole reason :stable can exist. The soak exists to catch
  # functional regressions, and those live in the commit: our code and our tool
  # pins. An OS package refresh changes neither. But the remedy for an OS CVE is
  # a rebuild, a rebuild mints a new digest, and under a digest clock that reset
  # the soak to zero -- so fixing a CVE restarted the very wait that fixing it
  # was supposed to end.
  #
  # Measured over 2026-05-22..2026-08-13, findings that block this gate arrived
  # on 8 distinct days in 83 -- lambda 0.096/day, so P(a clean 7-day window) is
  # about e^-0.67 = 0.51. A coin flip per attempt, and every loss restarted the
  # clock. That is why no promotion had ever completed.
  #
  # With the clock on the release, publish.yml's weekly base refresh rebuilds
  # the SAME commit on a fresh base and republishes :latest. The release has
  # already soaked, so the refreshed digest is promotable immediately and OS
  # CVEs close within a week without ever restarting the wait. A genuinely new
  # release still soaks the full 7 days, which is the case the gate is for.
  #
  # The trade, recorded so it is a decision and not an accident: :stable can
  # point at a digest that was never itself :latest in anyone's pipeline. The
  # delta from the soaked digest is Wolfi package versions only -- same commit,
  # same tool pins, same scanner code -- and ci.yml's smoke test runs against
  # the rebuild before it is published.
  COOLING_DAYS: 7

jobs:
  promote:
    name: Promote latest → stable
    runs-on: ubuntu-latest
    permissions:
      contents: read        # no step writes repository contents
      packages: write       # re-tag images
      id-token: write       # OIDC for the promotion attestation (cosign verify needs no token of its own)
      attestations: write   # promotion attestation
      issues: write         # open blocked-promotion issues

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Grype
        uses: ./.github/actions/install-grype

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Re-tagging :latest -> :stable is a registry WRITE, so it depends on the
      # same repo-level Write grant on the container package that publish.yml
      # documents. This path has still never actually run: every scheduled run
      # so far skipped on the cooling-period gate, and :stable does not yet
      # exist. The first real promotion is what proves it.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve promotion candidate and release age
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `{{json .Manifest}}` piped through jq, not `{{.Manifest.Digest}}`.
          # A buildx that does not know that field does NOT error -- it ignores
          # the template and prints the whole human-readable inspect block, so
          # LATEST_DIGEST silently becomes a multi-line blob that passes the
          # `-z` check below and flows onward as if it were a digest. Observed
          # on buildx v0.22.0; the runner's newer buildx happens to accept the
          # field, which is exactly what makes it a trap rather than a failure.
          # The json form works on both, and the shape check makes a wrong
          # answer impossible to mistake for a right one.
          #
          # `|| true` for the same reason audit.yml needs it: under `bash -e` a
          # failing lookup aborts the step and the "nothing to promote" branch
          # below never runs, turning an ordinary missing-tag state into a red
          # workflow.
          LATEST_DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/zagware/zagware-scanner:latest \
            --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true)

          if [ -z "$LATEST_DIGEST" ]; then
            echo "No :latest tag found — nothing to promote"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "$LATEST_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Resolved :latest to '${LATEST_DIGEST}', which is not a digest. Refusing to promote something this workflow cannot name."
            exit 1
          fi

          echo "digest=$LATEST_DIGEST" >> "$GITHUB_OUTPUT"

          # Which release is this digest a build of? Read it from the image's
          # own org.opencontainers.image.version label, which publish.yml sets
          # explicitly from the release version for BOTH the release build and
          # the weekly refresh rebuild.
          #
          # The label, not a registry tag lookup. SUP-18 was exactly this class
          # of bug -- the age was measured against whichever version the API
          # reported as tagged `latest`, which need not be the image being
          # promoted. A label is baked into the digest at build time, so
          # digest -> version cannot drift or be re-pointed afterwards. The
          # binding runs from the candidate outward, never from a tag inward.
          VERSION=$(docker buildx imagetools inspect \
            "ghcr.io/zagware/zagware-scanner@${LATEST_DIGEST}" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.version" }}' \
            2>/dev/null || true)

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Candidate ${LATEST_DIGEST} carries no usable org.opencontainers.image.version label (got '${VERSION}'). The cooling period is measured from that release, so promotion fails closed rather than guessing which release this image is."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The release's publication date is the soak clock. It does not move
          # when the image is rebuilt, which is the entire point.
          RELEASE_DATE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            --jq '.published_at' 2>/dev/null || true)

          if [ -z "$RELEASE_DATE" ] || [ "$RELEASE_DATE" = "null" ]; then
            echo "::error::No published GitHub Release found for v${VERSION}, so the ${COOLING_DAYS}-day cooling period cannot be measured. Promotion fails closed. An image whose version label names a release that does not exist is itself the anomaly worth stopping on."
            exit 1
          fi

          # GNU date only -- these workflows only ever run on ubuntu-latest.
          RELEASE_TS=$(date -u -d "$RELEASE_DATE" +%s) || RELEASE_TS=""
          if [ -z "$RELEASE_TS" ]; then
            echo "::error::Could not parse the publication date '${RELEASE_DATE}' of release v${VERSION} -- failing closed."
            exit 1
          fi

          NOW_TS=$(date -u +%s)
          AGE_DAYS=$(( (NOW_TS - RELEASE_TS) / 86400 ))

          echo "Candidate digest: $LATEST_DIGEST"
          echo "Built from release: v${VERSION} (published ${RELEASE_DATE})"
          echo "Release age: ${AGE_DAYS} days"

          # Read the digest :stable currently points at. This is both the
          # "already promoted?" check and the only record of the digest this
          # run is about to overwrite -- without it a maintainer has to
          # reconstruct the previous :stable from GHCR version history by hand
          # under incident pressure. Recorded (not acted on) below: audit.yml
          # alerts, rollback stays a deliberate manual decision. See SUP-17.
          STABLE_DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/zagware/zagware-scanner:stable \
            --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || echo "")

          echo "previous_stable_digest=$STABLE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Current :stable digest (will be replaced): ${STABLE_DIGEST:-<none>}"

          if [ "$STABLE_DIGEST" = "$LATEST_DIGEST" ]; then
            echo ":stable already points to this digest — nothing to promote"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$AGE_DAYS" -lt "$COOLING_DAYS" ]; then
            echo "Latest tag is only ${AGE_DAYS} days old — needs ${COOLING_DAYS}-day cooling period"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "age_days=$AGE_DAYS" >> "$GITHUB_OUTPUT"

      - name: Verify :latest image signature
        if: steps.latest.outputs.skip != 'true'
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.latest.outputs.digest }}"
          echo "Verifying $IMAGE_REF carries a valid signature from this repo's publish workflow..."
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "^https://github.com/zagware/zagware-scanner/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "✓ Signature verified — $IMAGE_REF was built and signed by this repo's publish workflow"

      - name: Skip promotion
        if: steps.latest.outputs.skip == 'true'
        run: echo "Skipping promotion — see previous step output for reason."

      # Which bundled tools have a newer upstream release? A vendored-module
      # CVE in a vendor binary is only actionable if bumping that pin could
      # actually clear it, and that is only possible when a newer release
      # exists. Without this check the gate blocks on findings with no remedy
      # in existence -- the same unsatisfiable-gate bug one level in.
      #
      # This is not hypothetical. GO-2026-5970 (golang.org/x/text) published
      # 2026-07-14; no betterleaks release carried the fixed x/text until 1.8.1
      # on 2026-08-18, through 1.7.3, 1.7.4 and 1.8.0. A "block on any fixable
      # vendored module" gate would have held :stable shut for 35 days with
      # nothing this repository could have done about it.
      - name: Read pinned versions from Dockerfile
        if: steps.latest.outputs.skip != 'true'
        run: sed -n 's/^ARG //p' Dockerfile >> "$GITHUB_ENV"

      - name: Check whether a newer release exists for each bundled tool
        if: steps.latest.outputs.skip != 'true'
        id: newer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # binary|repo|pinned. The binary name is what grype attributes a
          # finding to; the repo is where a remedy would come from.
          TOOLS="syft|anchore/syft|${SYFT_VERSION}
          grype|anchore/grype|${GRYPE_VERSION}
          betterleaks|betterleaks/betterleaks|v${BETTERLEAKS_VERSION}
          osv-scanner|google/osv-scanner|${OSV_SCANNER_VERSION}"

          echo '{}' > /tmp/newer.json
          while IFS='|' read -r binary repo pinned; do
            [ -n "$binary" ] || continue
            binary=$(printf '%s' "$binary" | tr -d '[:space:]')
            pinned=$(printf '%s' "$pinned" | tr -d '[:space:]')

            LATEST=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
            if [ -z "$LATEST" ]; then
              # Fail closed, and loudly. Guessing here would either invent a
              # remedy that does not exist or hide one that does, and both are
              # the fabricated-answer class SUP-01 removed from these gates.
              echo "::error::Could not resolve the latest release of ${repo}, so it cannot be determined whether a newer version would clear its findings. Promotion fails closed rather than guessing."
              exit 1
            fi

            if [ "$pinned" = "$LATEST" ]; then HAS_NEWER=false; else HAS_NEWER=true; fi
            echo "  ${binary}: pinned=${pinned} latest=${LATEST} newer=${HAS_NEWER}"

            jq -c --arg b "$binary" --argjson n "$HAS_NEWER" '. + {($b): $n}' \
              /tmp/newer.json > /tmp/newer.next && mv /tmp/newer.next /tmp/newer.json
          done <<< "$TOOLS"

          echo "value=$(cat /tmp/newer.json)" >> "$GITHUB_OUTPUT"

      # ── The CVE gate ──────────────────────────────────────────────────────
      # This blocks on findings WE CAN ACT ON, which is not the same as every
      # fixable finding, and is very much not the same as every finding.
      #
      # A raw `HIGH_COUNT != 0` gate was unsatisfiable by construction and had
      # therefore never promoted anything: the image bundles five third-party
      # Go binaries, and 2026-08-25's :latest carried 50 critical/high of which
      # 32 were Go `stdlib` advisories baked into vendor-built binaries. Grype
      # marks those "fixed" because a patched Go release exists -- but the fix
      # is Anchore's or betterleaks' to apply by rebuilding, not ours. Bumping
      # every pin to its newest upstream release still leaves them. A gate that
      # can only pass on a condition no action of ours produces is not a gate;
      # it is a permanently closed door, and it is why :stable did not exist.
      #
      # So the gate asks the question that actually has an answer: is there a
      # finding a base re-pin or a version bump would clear?
      #
      #   OS packages              -> ours (re-pin WOLFI_DIGEST)         BLOCKS
      #   kics                     -> ours (we build it; GO_VERSION)     BLOCKS
      #   vendor module, newer rel -> bumping that pin may clear it      BLOCKS
      #   vendor module, on latest -> no released fix exists yet         reported
      #   vendor binary, stdlib    -> only a vendor rebuild clears it    reported
      #   no fix in existence      -> nobody can clear it                reported
      #
      # The stdlib carve-out stays even when a newer release exists, because a
      # newer release does not imply a newer toolchain: Syft v1.51.1 shipped
      # 2026-08-27, fourteen days after Go 1.26.6 closed six stdlib advisories,
      # and is still built with go1.26.3 carrying all seven. Bumping to it would
      # not clear one of them, so blocking on them would just be the closed door
      # again, wearing a version number.
      #
      # None of this is silence: tool-currency.yml reports every one of them
      # weekly, per owning binary, and escalates when a vendor goes quiet while
      # carrying them. The counts are written into the signed promotion
      # predicate below, so a promoted digest always carries its own honest
      # vulnerability total -- we publish the number, we just stopped pretending
      # we could drive it to zero.
      #
      # VENDOR_BINARIES is duplicated in audit.yml and pinned equal by
      # tests/test_workflow_grype_gating.py, the same test-enforced-duplication
      # arrangement install-grype uses for the Grype pin.
      - name: Scan image for CVEs (Grype)
        if: steps.latest.outputs.skip != 'true'
        id: scan
        env:
          # Reaches bash as an env var rather than being interpolated into the
          # script text, the same way PREVIOUS_STABLE_DIGEST does below: the
          # run block stays free of ${{ }} so it can be extracted and executed
          # verbatim by tests/test_workflow_grype_gating.py.
          HAS_NEWER: ${{ steps.newer.outputs.value }}
        run: |
          IMAGE_REF="ghcr.io/zagware/zagware-scanner@${{ steps.latest.outputs.digest }}"
          echo "Scanning $IMAGE_REF for CVEs..."

          VENDOR_BINARIES='["syft","grype","betterleaks","osv-scanner"]'

          set +e
          SCAN_JSON=$(grype "$IMAGE_REF" -o json 2>/tmp/grype-stderr.log)
          GRYPE_EXIT=$?
          set -e

          if [ "$GRYPE_EXIT" -ne 0 ] || ! echo "$SCAN_JSON" | jq -e '.matches | type == "array"' >/dev/null 2>&1; then
            echo "::error::Grype scan of $IMAGE_REF failed or returned unparseable output (exit $GRYPE_EXIT)."
            echo "::error::This is a SCAN FAILURE, not a clean result — promotion cannot proceed without a real answer."
            cat /tmp/grype-stderr.log
            exit 1
          fi

          # Absent (a standalone run of this block, or a skipped probe) means
          # "no newer release known", which withholds the vendor-module block
          # rather than inventing a remedy. Assigned to a plain variable
          # because `${HAS_NEWER:-{\}}` expands to the literal `{\}` under
          # bash, which is not JSON and takes jq down with it.
          NEWER_JSON="${HAS_NEWER:-}"
          [ -n "$NEWER_JSON" ] || NEWER_JSON='{}'

          # A finding blocks when a remedy exists on our side:
          #   not vendor                  -> OS or kics, ours to re-pin
          #   vendor, module, newer rel   -> bumping that pin may clear it
          # Everything else is reported and does not block.
          #
          # `$vendors | index($owner)` binds $owner FIRST on purpose: writing
          # `index(.owner)` reads `.` as the piped-in $vendors array, not the
          # finding, and jq fails with "cannot index array with string".
          COUNTS=$(echo "$SCAN_JSON" \
            | jq -c --argjson vendors "$VENDOR_BINARIES" \
                   --argjson newer "$NEWER_JSON" '
            [ .matches[]
              | select(.vulnerability.severity | ascii_downcase | test("high|critical"))
              | (((.artifact.locations[0].path // "") | split("/") | last) // "") as $owner
              | { fixable: ((.vulnerability.fix.state // "") == "fixed"),
                  stdlib:  ((.artifact.name // "") == "stdlib"),
                  vendor:  (($vendors | index($owner)) != null),
                  bumpable: (($newer[$owner]) == true) } ]
            | { total:    length,
                fixable:  (map(select(.fixable)) | length),
                blocking: (map(select(.fixable
                                      and ((.vendor | not)
                                           or ((.stdlib | not) and .bumpable))))
                           | length) }')

          HIGH_COUNT=$(echo "$COUNTS" | jq -r '.total')
          FIXABLE_COUNT=$(echo "$COUNTS" | jq -r '.fixable')
          BLOCKING_COUNT=$(echo "$COUNTS" | jq -r '.blocking')

          echo "high_count=$HIGH_COUNT" >> "$GITHUB_OUTPUT"
          echo "fixable_count=$FIXABLE_COUNT" >> "$GITHUB_OUTPUT"
          echo "blocking_count=$BLOCKING_COUNT" >> "$GITHUB_OUTPUT"

          echo "$HIGH_COUNT HIGH/CRITICAL total; $FIXABLE_COUNT have an upstream fix; $BLOCKING_COUNT are ours to act on"

          if [ "$BLOCKING_COUNT" != "0" ]; then
            echo "Found $BLOCKING_COUNT actionable HIGH/CRITICAL vulnerabilities — promotion blocked"
            echo "$SCAN_JSON" | jq -r --argjson vendors "$VENDOR_BINARIES" \
                                      --argjson newer "$NEWER_JSON" '
              .matches[]
              | select(.vulnerability.severity | ascii_downcase | test("high|critical"))
              | select((.vulnerability.fix.state // "") == "fixed")
              | (((.artifact.locations[0].path // "") | split("/") | last) // "") as $owner
              | (($vendors | index($owner)) != null) as $isvendor
              | select(($isvendor | not)
                       or (((.artifact.name // "") != "stdlib") and (($newer[$owner]) == true)))
              | "  \($owner): \(.vulnerability.id) in \(.artifact.name // "?")@\(.artifact.version // "?")"'
            echo "scan_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing actionable — safe to promote"
            echo "scan_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue for blocked promotion
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const count = '${{ steps.scan.outputs.blocking_count }}';
            const total = '${{ steps.scan.outputs.high_count }}';
            const digest = '${{ steps.latest.outputs.digest }}';

            // Check if a blocked-promotion issue already exists for this digest —
            // without this, once the cooling period elapses this workflow
            // runs daily via cron and would otherwise file a fresh issue every
            // single day the image remains vulnerable. See SUP-03.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,promotion-blocked'
            });

            const existing = issues.data.find(i => i.body && i.body.includes(digest));
            if (existing) {
              console.log(`Blocked-promotion issue already exists: ${existing.html_url}`);
              return;
            }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Promotion blocked: ${digest} has ${count} actionable HIGH/CRITICAL CVEs`,
              body: `The promotion of \`ghcr.io/zagware/zagware-scanner@${digest}\` to :stable was blocked because Grype found **${count}** HIGH/CRITICAL vulnerabilities that a base re-pin or a tool version bump would clear (${total} HIGH/CRITICAL in total; the remainder are either unfixable upstream or Go \`stdlib\` inside a vendor-built binary, which only that vendor's next release can move — tool-currency.yml tracks those).\n\nThe scan step's log lists each blocking finding with its owning binary.\n\nThe image remains on :latest. Re-pin the base or bump the affected tool, publish, and this workflow will retry on its next run.`,
              labels: ['security', 'promotion-blocked']
            });

      - name: Promote to stable and secure
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        run: |
          DIGEST="${{ steps.latest.outputs.digest }}"

          echo "Promoting $DIGEST to :stable and :secure..."

          # Re-tag :stable → @digest (no rebuild — just copies the manifest pointer)
          docker buildx imagetools create \
            --tag ghcr.io/zagware/zagware-scanner:stable \
            "ghcr.io/zagware/zagware-scanner@${DIGEST}"

          # Re-tag :secure → @digest (same digest as :stable)
          docker buildx imagetools create \
            --tag ghcr.io/zagware/zagware-scanner:secure \
            "ghcr.io/zagware/zagware-scanner@${DIGEST}"

          echo "✓ Promoted to :stable and :secure"

      - name: Build promotion predicate
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        run: |
          # replacedDigest is the rollback record: audit.yml can only alert,
          # and nothing else in the repo archives the digest :stable pointed at
          # before this run overwrote it. Putting it in the signed promotion
          # predicate means the value survives log retention. See SUP-17.
          #
          # cveScan carries all three counts, not just the one the gate reads.
          # highOrCriticalCount is what the image actually contains;
          # fixableCount is how many have a patch published anywhere upstream;
          # actionableCount is how many a base re-pin or a version bump here
          # would clear, and zero is the promotion condition. The gap between
          # the middle number and the last one is Go stdlib compiled into
          # vendor-built binaries, which moves only when that vendor rebuilds.
          # A promoted digest therefore always ships its own honest total.
          #
          # These notes live above the jq program, not inside it: an apostrophe
          # in a jq comment closes the surrounding shell quote and the step
          # dies with "jq: 1 compile error".
          jq -n \
            --arg digest "${{ steps.latest.outputs.digest }}" \
            --arg replaced_digest "${{ steps.latest.outputs.previous_stable_digest }}" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg cooling_period_days "${{ steps.latest.outputs.age_days }}" \
            --arg high_critical_count "${{ steps.scan.outputs.high_count }}" \
            --arg fixable_count "${{ steps.scan.outputs.fixable_count }}" \
            --arg blocking_count "${{ steps.scan.outputs.blocking_count }}" \
            --arg workflow_run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              digest: $digest,
              replacedDigest: (if $replaced_digest == "" then null else $replaced_digest end),
              promotedAt: $promoted_at,
              promotedTags: ["stable", "secure"],
              sourceTag: "latest",
              coolingPeriodDays: ($cooling_period_days | tonumber),
              cveScan: {
                tool: "grype",
                highOrCriticalCount: ($high_critical_count | tonumber),
                fixableCount: ($fixable_count | tonumber),
                actionableCount: ($blocking_count | tonumber)
              },
              workflowRun: $workflow_run
            }' > /tmp/promotion-predicate.json

      - name: Attest promotion
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/zagware/zagware-scanner
          subject-digest: ${{ steps.latest.outputs.digest }}
          predicate-type: https://zagware.io/attestations/promotion/v1
          predicate-path: /tmp/promotion-predicate.json

      - name: Promotion summary
        if: steps.latest.outputs.skip != 'true' && steps.scan.outputs.scan_failed != 'true'
        env:
          PREVIOUS_STABLE_DIGEST: ${{ steps.latest.outputs.previous_stable_digest }}
        run: |
          echo "## Promoted to :stable and :secure" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.latest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cooling period:** ${{ steps.latest.outputs.age_days }} days" >> $GITHUB_STEP_SUMMARY
          echo "**CVE scan:** ${{ steps.scan.outputs.high_count }} HIGH/CRITICAL (${{ steps.scan.outputs.fixable_count }} fixable upstream, ${{ steps.scan.outputs.blocking_count }} actionable by us — promotion requires 0 actionable)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Rollback record. audit.yml alerts but cannot re-tag, and nothing
          # else archives the digest :stable pointed at before this run. See
          # SUP-17. Rollback stays a deliberate manual action.
          if [ -n "$PREVIOUS_STABLE_DIGEST" ]; then
            echo "**Previous :stable digest (replaced by this run):** \`${PREVIOUS_STABLE_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To roll back manually:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker buildx imagetools create --tag ghcr.io/zagware/zagware-scanner:stable \\" >> $GITHUB_STEP_SUMMARY
            echo "  ghcr.io/zagware/zagware-scanner@${PREVIOUS_STABLE_DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo "docker buildx imagetools create --tag ghcr.io/zagware/zagware-scanner:secure \\" >> $GITHUB_STEP_SUMMARY
            echo "  ghcr.io/zagware/zagware-scanner@${PREVIOUS_STABLE_DIGEST}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "**Previous :stable digest:** none — this is the first promotion, so there is nothing to roll back to." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ghcr.io/zagware/zagware-scanner:stable \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp '^https://github.com/zagware/zagware-scanner/.+\$' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
