# Zagware IaC Scanner — Azure DevOps Pipelines
# ──────────────────────────────────────────────
# Add or merge this into your azure-pipelines.yml.
#
# Prerequisites:
#   1. In your pipeline, enable "Allow scripts to access the OAuth token"
#      (Pipeline → Edit → Triggers → YAML → Additional options) so that
#      $(System.AccessToken) has pull request comment write permission.
#   2. Ensure the build service identity has "Contribute to pull requests"
#      permission on the repository.
#
# Optional pipeline variables:
#   ZAGWARE_EXCLUDE_PATHS   Comma-separated paths to skip (default: .git)
#   ZAGWARE_FAIL_ON_NEW     Set to "true" to fail the task when new findings exist

trigger: none   # run only on pull requests

pr:
  branches:
    include:
      - '*'

jobs:
  - job: ZagwareIaCScan
    displayName: IaC security scan
    pool:
      vmImage: ubuntu-latest
    steps:
      - script: |
          docker run --rm \
            -e SYSTEM_ACCESSTOKEN \
            -e SYSTEM_TEAMFOUNDATIONCOLLECTIONURI \
            -e SYSTEM_TEAMPROJECT \
            -e BUILD_REPOSITORY_ID \
            -e BUILD_REPOSITORY_URI \
            -e BUILD_SOURCEVERSION \
            -e SYSTEM_PULLREQUEST_TARGETBRANCH \
            -e SYSTEM_PULLREQUEST_SOURCEBRANCH \
            -e SYSTEM_PULLREQUEST_PULLREQUESTID \
            -e TF_BUILD \
            -e ZAGWARE_EXCLUDE_PATHS \
            -e ZAGWARE_FAIL_ON_NEW \
            davymcaleer99/zagware-iac-scan:latest
        displayName: Zagware IaC Scanner
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        continueOnError: true   # remove to gate merges on the scan result
