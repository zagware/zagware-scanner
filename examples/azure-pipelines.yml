# Zagware Security Scanner — Azure DevOps
# ──────────────────────────────────────────
# Add to your azure-pipelines.yml.
#
# Setup: usually none beyond this file. $(System.AccessToken) is exposed to the script step
# via the explicit `env:` mapping below, and the default Project Collection Build Service
# identity can already read/post PR comments on most organizations.
#   - If the scan step fails posting the comment (401/403 in the log), grant the Build
#     Service identity "Contribute to pull requests" on the repository:
#     Project settings → Repositories → Security → Build Service
#   - If $(System.AccessToken) itself comes through empty (rare — seen on pipelines
#     migrated from the classic editor), enable "Allow scripts to access the OAuth token":
#     Pipeline → Edit → Triggers → YAML → Additional options
#
# Pipeline variables (Pipelines → Library or inline):
#   ZAGWARE_PLATFORM_URL    https://app.zagware.io    (optional — omit for standalone)
#   ZAGWARE_PLATFORM_TOKEN  API token (optional, mark as secret)
#
# Optional variables:
#   ZAGWARE_EXCLUDE_PATHS   Comma-separated paths to skip (default: .git)
#   ZAGWARE_FAIL_ON_NEW     "true" to fail on any new finding
#   ZAGWARE_MIN_SEVERITY    CRITICAL | HIGH | MEDIUM | LOW (default: all)
#   ZAGWARE_SCA_ENABLED     "false" to disable Grype dependency scanning
#
# Artifacts saved to zagware-scan-results/ and published to the pipeline run:
#   iac-base.json, iac-head.json, sca-base.json, sca-head.json,
#   sca-new.json, pr-comment.md, summary.json (includes timings)
#
# Image: ghcr.io/zagware/zagware-scanner
# Source: https://github.com/zagware/zagware-scanner

trigger: none

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      docker run --rm \
        -e SYSTEM_ACCESSTOKEN \
        -e SYSTEM_TEAMFOUNDATIONCOLLECTIONURI \
        -e SYSTEM_TEAMPROJECT \
        -e BUILD_REPOSITORY_ID \
        -e BUILD_REPOSITORY_URI \
        -e BUILD_REPOSITORY_NAME \
        -e BUILD_SOURCEVERSION \
        -e SYSTEM_PULLREQUEST_TARGETBRANCH \
        -e SYSTEM_PULLREQUEST_SOURCEBRANCH \
        -e SYSTEM_PULLREQUEST_PULLREQUESTID \
        -e TF_BUILD \
        -e ZAGWARE_PLATFORM_URL=$(ZAGWARE_PLATFORM_URL) \
        -e ZAGWARE_PLATFORM_TOKEN=$(ZAGWARE_PLATFORM_TOKEN) \
        -v "$(Build.SourcesDirectory)/zagware-scan-results:/zagware-scan-results" \
        -e ZAGWARE_OUTPUT_DIR=/zagware-scan-results \
        ghcr.io/zagware/zagware-scanner:latest
    displayName: Zagware Security Scanner (IaC + SCA)
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    continueOnError: true   # remove to gate PRs on the scan result

  - task: PublishBuildArtifacts@1
    displayName: Publish scan artifacts
    condition: always()
    inputs:
      pathToPublish: zagware-scan-results
      artifactName: zagware-scan-results-pr$(System.PullRequest.PullRequestId)
