# Zagware Security Scanner — GitHub Actions
# ──────────────────────────────────────────
# Add this file to .github/workflows/ in your repository.
# No other files are required.
#
# Optional: set these secrets to upload results to the Zagware platform.
# The scanner works standalone (PR comments only) without them.
#   ZAGWARE_PLATFORM_URL    e.g. https://app.zagware.io
#   ZAGWARE_PLATFORM_TOKEN  your API token from Settings → API Tokens
#
# Optional env vars:
#   ZAGWARE_EXCLUDE_PATHS   Comma-separated paths to skip (default: .git)
#   ZAGWARE_FAIL_ON_NEW     "true" to fail the job on any new finding
#   ZAGWARE_MIN_SEVERITY    Minimum severity: CRITICAL|HIGH|MEDIUM|LOW
#   ZAGWARE_SCA_ENABLED     "false" to disable Grype dependency scanning

name: Zagware Security Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: zagware-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write   # required to post the PR comment

jobs:
  security-scan:
    name: IaC + SCA security scan
    runs-on: ubuntu-latest
    steps:
      - name: Zagware Security Scanner
        uses: docker://ghcr.io/davymcaleer99/zagware-scanner:latest
        env:
          GITHUB_TOKEN:           ${{ github.token }}
          PR_NUMBER:              ${{ github.event.pull_request.number }}
          ZAGWARE_PLATFORM_URL:   ${{ secrets.ZAGWARE_PLATFORM_URL }}
          ZAGWARE_PLATFORM_TOKEN: ${{ secrets.ZAGWARE_PLATFORM_TOKEN }}
