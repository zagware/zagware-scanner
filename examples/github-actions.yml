# Zagware IaC Scanner — GitHub Actions
# ─────────────────────────────────────
# Add this file to .github/workflows/ in your repository.
# No other files are required.
#
# Optional environment variables (add under env: in the step):
#   ZAGWARE_EXCLUDE_PATHS   Comma-separated paths to skip (default: .git)
#   ZAGWARE_FAIL_ON_NEW     Set to "true" to fail the job when new findings exist
#   ZAGWARE_PLATFORM_URL    Zagware GTP platform URL (optional — uploads are skipped if not set)
#   ZAGWARE_PLATFORM_TOKEN  API token for the platform (optional — uploads are skipped if not set)

name: Zagware IaC Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: zagware-iac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write   # required to post the comment

jobs:
  iac-scan:
    name: IaC security scan
    runs-on: ubuntu-latest
    steps:
      - name: Zagware IaC Scanner
        uses: docker://ghcr.io/zagware/iac-scanner:latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}

          ZAGWARE_PLATFORM_URL:   ${{ secrets.ZAGWARE_PLATFORM_URL }}
          ZAGWARE_PLATFORM_TOKEN: ${{ secrets.ZAGWARE_PLATFORM_TOKEN }}