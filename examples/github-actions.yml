# Zagware Security Scanner — GitHub Actions
# ──────────────────────────────────────────
# Add this file to .github/workflows/ in your repository. No other files needed.
#
# Secrets required:
#   ZAGWARE_PLATFORM_URL    https://app.zagware.io    (optional — omit for standalone)
#   ZAGWARE_PLATFORM_TOKEN  API token from Settings → API Tokens (optional)
#
# Optional env vars (add under env: in the step):
#   ZAGWARE_EXCLUDE_PATHS   Comma-separated paths to skip (default: .git)
#   ZAGWARE_FAIL_ON_NEW     "true" to fail the job on any new finding
#   ZAGWARE_MIN_SEVERITY    CRITICAL | HIGH | MEDIUM | LOW (default: all)
#   ZAGWARE_SCA_ENABLED     "false" to disable Grype dependency scanning
#   ZAGWARE_OUTPUT_DIR      Directory for scan artifacts (default: zagware-scan-results)
#
# Artifacts saved to zagware-scan-results/ on every run (uploaded for 30 days):
#   iac-base.json     KICS findings on base branch
#   iac-head.json     KICS findings on PR branch
#   sca-base.json     Grype findings on base branch (normalised)
#   sca-head.json     Grype findings on PR branch
#   sca-new.json      Net-new SCA findings introduced by this PR
#   pr-comment.md     The rendered markdown comment posted to the PR
#   summary.json      Metadata + per-phase timings (seconds)
#
# Interactive suppression: reviewers can comment `/zagware suppress <id> <reason>`
# on a PR (copy the id shown in the "📋 Suppress findings" section of the scan
# comment) to mute a finding. This requires the issue_comment trigger below —
# GitHub only sends pull_request events for pushes/opens, not for comments.
# contents: write is required so the scanner can commit the suppression entry
# to .zagware/suppressions.yaml on the PR branch. Only PR authors/collaborators
# (author_association OWNER/MEMBER/COLLABORATOR) can trigger a suppression.
#
# Image: ghcr.io/zagware/zagware-scanner
# Source: https://github.com/zagware/zagware-scanner
# Verify: cosign verify ghcr.io/zagware/zagware-scanner:latest \
#           --certificate-identity-regexp "^https://github.com/zagware/zagware-scanner/.+$" \
#           --certificate-oidc-issuer https://token.actions.githubusercontent.com

name: Zagware Security Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: zagware-scanner-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write   # required for /zagware suppress to commit suppressions.yaml

jobs:
  security-scan:
    name: IaC + SCA security scan
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/zagware suppress') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      # issue_comment events don't carry PR base/head refs the way pull_request
      # events do (GITHUB_BASE_REF/GITHUB_HEAD_REF are unset) — look them up.
      # NOTE: GitHub Actions reserves the GITHUB_* env var namespace — a step's
      # env: block cannot override GITHUB_BASE_REF/GITHUB_HEAD_REF for docker://
      # actions (the runner's actual value is always passed through instead).
      # ZAGWARE_BASE_REF/ZAGWARE_HEAD_REF are read by the scanner as an override.
      - name: Resolve PR refs (comment-triggered runs only)
        if: github.event_name == 'issue_comment'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
          echo "base_ref=$(echo "$PR_JSON" | jq -r .base.ref)" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$PR_JSON" | jq -r .head.ref)" >> "$GITHUB_OUTPUT"

      - name: Zagware Security Scanner
        uses: docker://ghcr.io/zagware/zagware-scanner:latest
        env:
          GITHUB_TOKEN:           ${{ github.token }}
          PR_NUMBER:              ${{ github.event.pull_request.number || github.event.issue.number }}
          ZAGWARE_BASE_REF:       ${{ steps.pr.outputs.base_ref }}
          ZAGWARE_HEAD_REF:       ${{ steps.pr.outputs.head_ref }}
          ZAGWARE_PLATFORM_URL:   ${{ secrets.ZAGWARE_PLATFORM_URL }}
          ZAGWARE_PLATFORM_TOKEN: ${{ secrets.ZAGWARE_PLATFORM_TOKEN }}

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zagware-scan-results-pr${{ github.event.pull_request.number || github.event.issue.number }}
          path: zagware-scan-results/
          retention-days: 30
          if-no-files-found: warn
