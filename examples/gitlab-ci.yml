# Zagware Security Scanner — GitLab CI
# ─────────────────────────────────────
# Merge into your existing .gitlab-ci.yml, or use as a standalone file.
#
# One-time setup:
#   GitLab's CI_JOB_TOKEN cannot write MR notes (GitLab platform limitation).
#   Create a project or group access token with 'api' scope and add it as a
#   CI/CD variable named GITLAB_TOKEN:
#     Settings → CI/CD → Variables → Add variable
#     Key: GITLAB_TOKEN  |  Value: <your token>  |  Mask: ✅
#
# Optional variables (set in Settings → CI/CD → Variables):
#   ZAGWARE_PLATFORM_URL    https://app.zagware.io    (optional — omit for standalone)
#   ZAGWARE_PLATFORM_TOKEN  API token (optional)
#   ZAGWARE_EXCLUDE_PATHS   Comma-separated paths to skip (default: .git)
#   ZAGWARE_FAIL_ON_NEW     "true" to fail the job when new findings exist
#   ZAGWARE_MIN_SEVERITY    CRITICAL | HIGH | MEDIUM | LOW | INFO | TRACE (default: all)
#   ZAGWARE_SCA_ENABLED     "false" to disable Grype dependency scanning
#   ZAGWARE_SECRETS_ENABLED "false" to disable betterleaks secrets scanning
#   ZAGWARE_SECRETS_FAIL_ON_PUBLIC
#                           DEFAULT "true" -- on a PUBLIC repository a new secret
#                           exits 1 and blocks the merge even with
#                           ZAGWARE_FAIL_ON_NEW unset. Set "false" to opt out.
#
# Artifacts: ten files saved to zagware-scan-results/ and kept for 30 days --
# see README's "Scan artifacts" section for the full list (iac-*.json,
# sca-*.json, secrets-*.json, pr-comment.md, summary.json).
#
# Image: ghcr.io/zagware/zagware-scanner:latest (see README's "Image tags and
#        release channels" -- pin :stable, or better a @sha256:<digest>, once
#        :stable is published; :latest has no cooling-off period or CVE gate)
# Source: https://github.com/zagware/zagware-scanner

zagware-scanner:
  stage: test
  image: ghcr.io/zagware/zagware-scanner:latest
  variables:
    ZAGWARE_PLATFORM_URL:   $ZAGWARE_PLATFORM_URL
    ZAGWARE_PLATFORM_TOKEN: $ZAGWARE_PLATFORM_TOKEN
  script:
    - zagware-scan
  artifacts:
    name: zagware-scan-results-mr$CI_MERGE_REQUEST_IID
    paths:
      - zagware-scan-results/
    expire_in: 30 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true   # remove to gate merges on the scan result
